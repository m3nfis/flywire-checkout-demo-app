# =============================================================================
# The Caldera House — English source strings
# Locale: en-GB
#
# This file is the source the translation team edits. The page reads it at
# runtime (see public/i18n.js). Comments are for translators and are not shown.
#
# How to read a key
# - The comment directly above a key says where it appears and any constraint.
# - Nested keys become dotted names in the app, e.g. rooms.hero.title.
#
# Rules
# - Keep every {placeholder} exactly, including the braces. The app fills them
#   in. Example: "{amount} paid in full." — translate the words, leave {amount}.
# - Keys that end in _one, _other, _two, _few, _many or _zero are plural forms.
#   {count} is the number. English only needs _one (exactly 1) and _other
#   (everything else). Add the other suffixes if your language needs them
#   (Polish, Arabic, Russian, and others). If a form is missing, the app uses
#   _other.
# - [html] means the value contains tags such as <br>, <strong>, <em>, <a> or
#   <code>. Translate the words. Leave tags, hrefs and class names unchanged.
# - [do not translate] means the value is a proper noun, brand, code or
#   endonym and must stay as written.
# - Tone: sections under "guest" voice speak to the hotel guest (warm, luxury,
#   second person). Sections marked "presenter" speak to the person running
#   the demo or the hotel back office (plain instructions).
# - Keep button and stepper labels short. Where length matters, the comment says so.
# - Do not translate API field names, URLs, currency codes, portal codes, or
#   the sample code in the integration preview. Those are not in this file.
#
# Not in this file
# - Developer documentation under public/full-docs and public/minimal-docs.
# - Code comments, console messages, and the generated checkout payload.
# =============================================================================

# -----------------------------------------------------------------------------
# Shared words used on more than one screen
# -----------------------------------------------------------------------------
common:
  # Booking total row. Short label, paired with a money amount.
  total: "Total"
  # Date the guest arrives. Short label in a summary list.
  checkIn: "Check-in"
  # Date the guest leaves. Short label in a summary list.
  checkOut: "Check-out"
  # How many people are staying. Short label in a summary list.
  guests: "Guests"
  # The room that was booked. Short label.
  suite: "Suite"
  # Closes a popover or drawer. Button.
  done: "Done"
  # Restores the previous dates and guest counts. Text button in the date popover.
  reset: "Reset"
  # Copies text to the clipboard. Small button. Restored after "Copied".
  copy: "Copy"
  # Shown for about a second after a copy succeeds. Same button as "Copy".
  copied: "Copied"
  # Shown for about a second when the browser blocks clipboard access.
  copyFailed: "Copy failed"
  # Reveals a secret field (the API key). Small button. Opposite of "Hide".
  show: "Show"
  # Masks a secret field. Small button. Opposite of "Show".
  hide: "Hide"
  # Fallback when the guest has not given a name yet. Used in greetings.
  guest: "Guest"
  # Empty value in a definition list, e.g. a credential that has not been entered.
  notSet: "Not set"
  # Word before the last item of a list: "Client ID, recipient code and API key".
  and: "and"
  # Placeholder when a value is unknown. A single em dash. [do not translate]
  dash: "—"

# -----------------------------------------------------------------------------
# Browser tab titles
# -----------------------------------------------------------------------------
meta:
  # Browser tab title for the public booking site.
  # "The Caldera House" is the hotel name. "Oia" and "Santorini" are place names.
  # [do not translate] the hotel name and the place names. The em dash can stay.
  bookingTitle: "The Caldera House — Oia, Santorini"
  # Browser tab title for the hotel back office (staff page, not the guest page).
  # [do not translate] "The Caldera House".
  backOfficeTitle: "Back office — The Caldera House"

# -----------------------------------------------------------------------------
# Top bar of the booking site
# -----------------------------------------------------------------------------
nav:
  # Logo text. Hotel name. [do not translate]
  logo: "The Caldera House"
  # Small location label next to the logo. Place names. [do not translate]
  location: "Oia, Santorini"
  # Tooltip and screen-reader name for the heartbeat icon. Opens a presenter drawer
  # that lists what the payment checkout returned. Not part of the guest story.
  checkoutActivity: "Checkout activity"
  # Tooltip and screen-reader name for the grid icon. Opens the staff back office.
  backOffice: "Hotel back office"
  # Tooltip and screen-reader name for the gear icon. Opens presenter checkout settings.
  # {flow} is the name of the selected payment flow, e.g. "Pay in full".
  checkoutSettings: "Checkout settings"
  checkoutSettingsWithFlow: "Checkout settings · {flow}"

# -----------------------------------------------------------------------------
# Three-step progress bar under the header. Keep each label short.
# -----------------------------------------------------------------------------
stepper:
  # Step 1. Guest is choosing a room.
  selectRoom: "Select Room"
  # Step 2. Guest is entering name, email and address.
  guestDetails: "Guest Details"
  # Step 3. Guest is about to pay.
  payment: "Payment"

# -----------------------------------------------------------------------------
# Page 1 — room selection. Guest voice.
# -----------------------------------------------------------------------------
rooms:
  # Decorative photo behind the headline. Describe the picture, not the hotel brand.
  heroAlt: "Santorini blue domes overlooking the Aegean"
  # Small line above the headline. Hotel name and place. [do not translate]
  eyebrow: "The Caldera House · Oia, Santorini"
  # Main headline on the room list.
  title: "Choose Your Suite"
  # Tooltip, screen-reader text, and the date popover name. Opens the date and guest picker.
  changeDates: "Change dates and guests"
  # Price suffix when the hotel bills in US dollars. Keep the leading slash.
  perNight: "/night"
  # Price suffix when the hotel bills in another currency.
  # {currency} is an ISO code such as EUR or GBP. Do not translate the code.
  perNightWithCurrency: "/night · {currency}"
  # Button on every room card. Keep it short enough for a card footer.
  selectSuite: "Select This Suite"

  # Hero line under the headline, built in script.
  # {range} is the dates, e.g. "June 12 – 15, 2026".
  # {nights} and {guests} are already-translated phrases such as "3 Nights" and "2 Guests".
  staySummary: "{range} · {nights} · {guests}"

  cards:
    royal-caldera:
      # Marketing name of the featured suite. "Caldera" is the volcanic bay at Santorini;
      # keep it. "Royal" and "Suite" may be translated.
      name: "Royal Caldera Suite"
      # Alt text for the suite photo. Same name guests see on the card.
      alt: "Royal Caldera Suite"
      # Ribbon on the photo. One word if possible.
      badge: "Recommended"
      # Facts line under the name. Middle dots separate three facts. "m²" is square metres.
      specs: "120 m² · Caldera View · Private Infinity Pool"
      # Size only, reused in the booking summary. Keep "m²".
      size: "120 m²"
      # View only, reused in the booking summary.
      view: "Caldera View"
      # Paragraph on the card. Warm, descriptive.
      description: "The crown jewel of The Caldera House. A sprawling sanctuary with floor-to-ceiling windows framing the caldera, a private infinity pool, and a terrace designed for the world’s most celebrated sunset."
      # Short amenity chips. Keep each to one or two words.
      tagPool: "Private Pool"
      tagButler: "Butler Service"
      tagTerrace: "Terrace"
      tagKitchen: "Chef’s Kitchen"

    sunset-villa:
      # Marketing name. "Sunset" and "Honeymoon" may be translated. "Villa" may be translated.
      name: "Sunset Honeymoon Villa"
      alt: "Sunset Honeymoon Villa"
      specs: "95 m² · Sunset View · Outdoor Bath"
      size: "95 m²"
      view: "Sunset View"
      description: "A secluded villa wrapped in bougainvillea, with a private courtyard, outdoor copper bathtub, and uninterrupted views of Oia’s legendary sunset."
      tagBath: "Outdoor Bath"
      tagCourtyard: "Courtyard"
      tagSunset: "Sunset View"

    captains-quarters:
      # Marketing name. Nautical theme. The apostrophe is the hotel’s name for the room.
      name: "Captain’s Quarters"
      alt: "Captain’s Quarters"
      specs: "65 m² · Harbor View · Plunge Pool"
      size: "65 m²"
      view: "Harbor View"
      description: "Inspired by Santorini’s seafaring heritage, featuring whitewashed vaulted ceilings, hand-selected antiques, and a private courtyard with plunge pool."
      tagPlunge: "Plunge Pool"
      tagVaulted: "Vaulted Ceiling"
      tagCourtyard: "Courtyard"

    aegean-studio:
      # Marketing name. "Aegean" is the sea; keep it. "Cliff" and "Studio" may be translated.
      name: "Aegean Cliff Studio"
      alt: "Aegean Cliff Studio"
      specs: "45 m² · Sea View · Private Balcony"
      size: "45 m²"
      view: "Sea View"
      description: "A refined retreat carved into the volcanic cliff, with a private balcony suspended above the Aegean. Clean lines meet natural stone in this architect-designed studio."
      tagSea: "Sea View"
      tagBalcony: "Balcony"
      tagShower: "Rain Shower"

# -----------------------------------------------------------------------------
# Date and guest popover. Guest voice. Opened from "Change dates and guests".
# -----------------------------------------------------------------------------
stay:
  # Plural of nights, lowercase, used inside sentences and the price breakdown.
  # {count} is a number. See the plural rules at the top of this file.
  night_one: "{count} night"
  night_other: "{count} nights"
  # Same idea, title case, used in the hero summary ("3 Nights").
  nightTitle_one: "{count} Night"
  nightTitle_other: "{count} Nights"
  # Title case, hero summary ("2 Guests").
  guestTitle_one: "{count} Guest"
  guestTitle_other: "{count} Guests"
  # Guest count in the summary panel ("2 Adults").
  adult_one: "{count} Adult"
  adult_other: "{count} Adults"
  # Guest count when there are children. English "Child" / "Children" is irregular.
  child_one: "{count} Child"
  child_other: "{count} Children"
  # Extra people beyond the two guests included in the rate. Lowercase, mid-sentence.
  extraGuest_one: "{count} extra guest"
  extraGuest_other: "{count} extra guests"
  # Bookings count on the back office list.
  booking_one: "{count} booking made on the booking site"
  booking_other: "{count} bookings made on the booking site"
  # Nights column in the back office table.
  nightShort_one: "{count} night"
  nightShort_other: "{count} nights"
  # Relative time in the back office. {count} is minutes or hours.
  minutesAgo_one: "{count} min ago"
  minutesAgo_other: "{count} min ago"
  hoursAgo_one: "{count} h ago"
  hoursAgo_other: "{count} h ago"
  # Less than a minute ago.
  justNow: "just now"

  # Popover heading while the guest still needs to pick the departure date.
  selectCheckout: "Select check-out date"
  # Subtitle before a departure date is chosen.
  # {checkIn} is a short date such as "Fri, Jun 12, 2026". {max} is a number (30).
  checkoutHint: "Check-in {checkIn} · up to {max} nights"
  # Screen-reader name for the previous-month arrow.
  previousMonth: "Previous month"
  # Screen-reader name for the next-month arrow.
  nextMonth: "Next month"
  # Stepper label. Adults are ages 13+.
  adults: "Adults"
  # Hint under "Adults".
  adultsHint: "Ages 13 or above"
  # Stepper label.
  children: "Children"
  # Hint under "Children". An en dash between the ages.
  childrenHint: "Ages 2–12"
  # Note under the steppers. {guests} is a number (2). {amount} is a money amount.
  extraGuestFee: "Rates include {guests} guests. Each extra guest is {amount} per night."
  # Screen-reader name for the minus button. {who} is "adults" or "children", lowercase.
  removeGuests: "Remove {who}"
  # Screen-reader name for the plus button. {who} is "adults" or "children", lowercase.
  addGuests: "Add {who}"
  # Lowercase plural used only inside the screen-reader phrases above.
  adultsLower: "adults"
  childrenLower: "children"

  # Column headers of the month grid, Sunday through Saturday, in that order.
  # The grid starts on Sunday. Do not reorder these seven keys.
  # Keep them very short (about 2 letters in English).
  weekdaySu: "Su"
  weekdayMo: "Mo"
  weekdayTu: "Tu"
  weekdayWe: "We"
  weekdayTh: "Th"
  weekdayFr: "Fr"
  weekdaySa: "Sa"

# -----------------------------------------------------------------------------
# Page 2 — guest details form. Guest voice.
# -----------------------------------------------------------------------------
guest:
  # Form heading.
  title: "Guest Information"
  # Line under the heading.
  subtitle: "Please confirm your details for the reservation"
  # Form labels. Each sits above an empty text field.
  firstName: "First Name"
  lastName: "Last Name"
  email: "Email Address"
  phone: "Phone Number"
  address: "Street Address"
  city: "City"
  # Postal code. "ZIP" is the US term; "Postal" covers other countries. Keep both ideas.
  zip: "Postcode"
  country: "Country"
  # First option in the country menu, shown before a country is chosen.
  countryPlaceholder: "Select…"
  # Returns to the room list. The arrow is part of the label; you may use your language’s back arrow.
  backToRooms: "← Back to rooms"
  # Submits the form and opens the payment step. Button.
  continueToPayment: "Continue to Payment"
  # Heading of the side panel that repeats the chosen room.
  yourSelection: "Your Selection"

  # Country menu. The stored value is the two-letter code; only the name is translated.
  # Use the country’s usual name in your language.
  countries:
    ES: "Spain"
    GR: "Greece"
    IT: "Italy"
    FR: "France"
    DE: "Germany"
    GB: "United Kingdom"
    US: "United States"
    PT: "Portugal"
    NL: "Netherlands"
    CH: "Switzerland"
    AT: "Austria"
    BE: "Belgium"
    SE: "Sweden"
    NO: "Norway"
    DK: "Denmark"
    AU: "Australia"
    CA: "Canada"
    JP: "Japan"

# -----------------------------------------------------------------------------
# Page 3 — payment. Guest voice, plus a few presenter warnings.
# -----------------------------------------------------------------------------
booking:
  # Large photo on the payment page.
  heroAlt: "Santorini caldera view at sunset"
  # Three gallery captions under the payment-page photos.
  gallerySuiteAlt: "Royal Suite interior"
  gallerySuite: "The Royal Suite"
  galleryPoolAlt: "Infinity pool"
  galleryPool: "Infinity Pool"
  galleryDiningAlt: "Fine dining"
  galleryDining: "Private Dining"
  # Property story heading.
  sanctuaryTitle: "A Sanctuary Above the Sea"
  # First paragraph of the property story. Place names stay.
  sanctuaryBody1: "Perched on the volcanic cliffs of Oia, The Caldera House is where the Aegean meets the sky. Each suite opens to unobstructed views of the caldera, with hand-carved stone interiors, private plunge pools, and terraces designed for watching the most celebrated sunset in the world."
  # Second paragraph.
  sanctuaryBody2: "From candlelit dinners prepared by our resident chef to dawn yoga on the clifftop, every detail has been considered so you can simply be present."
  # Amenity list. Short phrases.
  amenityPool: "Private Infinity Pool"
  amenityChef: "In-Suite Chef Service"
  amenityTerrace: "Caldera View Terrace"
  amenitySpa: "Spa & Wellness"
  amenitySailing: "Sunset Sailing Excursion"
  amenityAirport: "Airport Concierge"
  # Returns to the guest form. Arrow may be mirrored in RTL languages.
  backToGuest: "← Back to guest details"
  # Side panel heading on the payment step.
  yourStay: "Your Stay"
  # Heading above the payment choice.
  payment: "Payment"
  # Security reassurance under the pay button.
  secured: "All transactions are secured and encrypted."
  # Line under that reassurance. {name} is the guest’s full name.
  guestLine: "Guest: {name}"
  # Tooltip on the pay button while Flywire demo credentials are missing.
  # Presenter voice — the person clicking has to open the back office first.
  credentialsFirst: "Add your Flywire demo credentials in the hotel back office first"
  # Notice when checkout rejects the configuration. {detail} is a technical field list from Flywire.
  # Presenter voice.
  configRejected: "Checkout rejected this configuration: {detail}"
  # Notice when checkout fails to open. {detail} is the error text.
  couldNotStart: "Checkout could not start: {detail}"
  # Shown in the activity log when a card is saved and no money is taken.
  noAmount: "No amount (card saved only)"
  # Activity log value. Presenter voice. Checkout drawn on top of the page.
  displayOverlay: "Full-screen overlay"
  # Activity log value. Checkout placed inside the booking panel.
  displayEmbedded: "Embedded in page"

  # Price breakdown lines. {nights} is "3 nights". {amount} is the nightly rate.
  nightlyCalc: "{nights} × {amount}"
  # {extras} is "1 extra guest" or "2 extra guests". {amount} is the fee. {nights} is "3 nights".
  extraCalc: "{extras} × {amount} × {nights}"

# -----------------------------------------------------------------------------
# Guest-facing names for the payment flow the presenter picked.
# These replace the "Payment" card title, description and the pay button.
# {amount} is a money amount such as "$7,350" or "€6.800".
# -----------------------------------------------------------------------------
flows:
  pay_full:
    # Guest sees this as the payment option title.
    guestTitle: "Pay in Full"
    guestDesc: "One-time payment of {amount}"
    # Pay button. {amount} is included.
    cta: "Pay {amount}"
    # Presenter sees this in the settings drawer, as the flow name.
    title: "Pay in full"
    # Presenter. One sentence under the flow name.
    pitch: "Prepaid rates, last-minute tours and experiences."
    # Link to a matching sample. Presenter.
    playground: "Payment with common fields"

  reserve_hold:
    guestTitle: "Reserve & Hold"
    guestDesc: "Pre-authorise {amount} today, charged at check-in"
    cta: "Reserve with a hold"
    title: "Reserve & hold"
    # "Pre-authorize" means a card hold, not a charge. "API" is the Flywire programming interface; you may keep "API".
    pitch: "Pre-authorise at booking, capture at check-in. Holds can be extended or increased by API."
    playground: "Payment with preauth"

  moto:
    # MOTO means Mail Order / Telephone Order: staff take the card, the guest is not on the website.
    # You may spell that out if the abbreviation is unknown, but keep it short (it is a menu title).
    guestTitle: "Reservations Desk Payment"
    guestDesc: "Agent-assisted payment of {amount}"
    cta: "Take payment of {amount}"
    title: "Phone & email bookings (MOTO)"
    pitch: "Reservations staff take the payment for guests booking by phone or email."
    playground: "MOTO payment"

  save_card:
    guestTitle: "Guarantee with Card"
    guestDesc: "Your card secures the booking. Nothing is charged today."
    cta: "Save card & reserve"
    title: "Save card, charge later"
    pitch: "Card-on-file guarantee. Charge deposits, balances or no-shows later with the token."
    playground: "Tokenization without amount"

  pay_save:
    guestTitle: "Pay & Save Card"
    guestDesc: "Pay {amount} now; card kept on file for extras"
    cta: "Pay {amount} & save card"
    title: "Pay now & save card"
    pitch: "Charge now and keep the card for extras: dive gear, spa, excursions, balances."
    playground: "Tokenization with amount"

  hold_save:
    guestTitle: "Hold & Save Card"
    guestDesc: "Pre-authorise {amount}; card kept on file for your final bill"
    cta: "Reserve with a hold"
    title: "Hold & save card"
    pitch: "Pre-authorise the stay and keep the card for the final bill and incidentals."
    playground: "Tokenization with preauth"

  optional:
    guestTitle: "Pay in Full"
    guestDesc: "One-time payment of {amount}, with the option to save your card"
    cta: "Pay {amount}"
    title: "Pay, guest may save card"
    pitch: "Guests decide whether to store their card for the next trip. Great for repeat guests."
    playground: "Optional tokenization"

  optional_hold:
    guestTitle: "Reserve & Hold"
    guestDesc: "Pre-authorise {amount}, with the option to save your card"
    cta: "Reserve with a hold"
    title: "Hold, guest may save card"
    pitch: "Pre-authorise the stay; the guest can opt in to keeping the card on file."
    playground: "Optional tokenization with preauth"

  implicit:
    guestTitle: "Pay in Full"
    guestDesc: "One-time payment of {amount}; card kept on file for your stay"
    cta: "Pay {amount}"
    title: "Pay & keep card on file"
    pitch: "Card is stored automatically when the method supports it. Ideal for balance-due and installment plans."
    playground: "Implicit tokenization"

  implicit_hold:
    guestTitle: "Reserve & Hold"
    guestDesc: "Pre-authorise {amount}; card kept on file for your stay"
    cta: "Reserve with a hold"
    title: "Hold & keep card on file"
    pitch: "Pre-authorise the stay and store the card automatically for later charges."
    playground: "Implicit tokenization with preauth"

  # Extra sentence under the payment option when part of the money goes to partners.
  # {parts} is a list such as "sunset catamaran excursion ($350) and couples spa ritual ($250)".
  splitNote: "Includes {parts}, settled directly with our partners."
  # Joiner used inside {parts} before the last partner. Same role as common.and, kept here
  # because it sits inside a guest sentence.
  splitAnd: "and"
  # Extra sentence when the hotel absorbs the card fee.
  noSurcharge: "No card surcharge."

  # Presenter. Group headings in the flow list.
  groups:
    payment: "Payments"
    tokenization: "Card on file"
    # Grey hint after the group name. Technical term for saving a card.
    tokenizationHint: "Tokenization"
    optional: "Guest chooses to save card"
    optionalHint: "Optional tokenization"
    implicit: "Card saved automatically"
    implicitHint: "Implicit tokenization"
  # Presenter. Badge when a flow cannot be selected until an API key is saved.
  needsApiKey: "Needs API key"
  # Presenter. Appended to the technical summary when the flow does not charge now.
  noAmountTech: "no amount"

  # Presenter. Extra sample links that appear when the matching setting is on.
  playground:
    authenticated: "Payment with authenticated session"
    embedded: "Payment embedded"
    split: "Payment with split"
    waive: "Payment with waived surcharge"
    offerRules: "Payment with offer rules"
    styles: "Payment with custom styles"
    timeout: "Payment with timeout"
    docs: "Checkout V2 configuration guide"

# -----------------------------------------------------------------------------
# Confirmation page after a successful checkout. Guest voice.
# -----------------------------------------------------------------------------
success:
  # Photo behind the confirmation.
  backgroundAlt: "Santorini sunset"
  # Small line above the confirmation headline. Changes with the kind of payment.
  eyebrowPaid: "Booking Confirmed"
  eyebrowHold: "Reservation Held"
  eyebrowCard: "Reservation Guaranteed"
  # Headline. The <br> is a deliberate line break. [html]
  title: "Your Santorini<br>Escape Awaits"
  # {name} is the guest’s first and last name.
  welcome: "Welcome, {name}"
  # {amount} is the money amount.
  notePaid: "{amount} paid in full."
  noteHold: "A hold of {amount} is on your card. You’ll be charged at check-in."
  noteCard: "Your card is securely saved. Nothing has been charged today."
  noteMoto: "{amount} taken by our reservations team."
  # Appended after the note when the card was also stored. Leading space is intentional.
  cardSaved: " Your card is saved for extras during your stay."
  cardSavedIfChosen: " Your card is saved if you chose to keep it."
  cardKeptWhereSupported: " Your card is kept on file where supported."
  # Heading above a short list of stay highlights.
  awaits: "What awaits you"
  highlightPool: "Private infinity pool perched above the caldera"
  highlightDinner: "Sunset dinner on your terrace, prepared by our chef"
  highlightSailing: "Exclusive catamaran sailing at golden hour"
  highlightSpa: "Complimentary couples spa ritual"
  # Presenter-only box under the confirmation. Not guest marketing.
  returnedBy: "Returned by Flywire · demo"
  viewActivity: "View checkout activity →"
  openDashboard: "Open in hotel dashboard →"
  # Reloads the site so the presenter can run the booking again.
  bookAnother: "Book Another Stay"
  # Labels in the presenter result list. The values next to them are ids and status codes.
  resultBooking: "Booking"
  resultFlow: "Flow"
  resultSession: "Session"
  resultSessionStatus: "Session status"
  resultPaymentStatus: "Payment status"
  resultMethod: "Payment method"

# -----------------------------------------------------------------------------
# Failure page. Guest voice, slightly playful on the card decline.
# -----------------------------------------------------------------------------
error:
  # Decline headline. Playful, not a formal banking error. Short.
  declinedTitle: "Woopsie!"
  declinedSubtitle: "Denied!"
  # [html] <br> is a line break.
  declinedMessage: "Your payment could not be processed.<br>Perhaps the universe is telling you to try a different card."
  # Checkout timer ran out. The presenter enabled a countdown.
  timeoutTitle: "Time’s up"
  timeoutSubtitle: "Your checkout expired"
  # [html]
  timeoutMessage: "We held your suite for as long as we could.<br>Start again to complete your booking."
  # Returns the guest to the payment step.
  tryAgain: "Try Again"
  viewActivity: "View checkout activity →"

# -----------------------------------------------------------------------------
# Warnings shown when Flywire demo credentials have not been entered.
# Presenter voice. {missing} is a list such as "API key" or "Client ID and recipient code".
# -----------------------------------------------------------------------------
credentials:
  # Field names used inside {missing}. "Client ID" and "API key" are product terms;
  # translate them consistently everywhere in this file.
  fields:
    client_id: "Client ID"
    code: "recipient code"
    api_key: "API key"
  # Used instead of a raw list when all three fields are empty. Sentence fragment, not a full sentence.
  allMissing: "Client ID, recipient code and API key"
  # Payment step. Bold first line.
  paymentTitle: "Checkout needs Flywire demo credentials."
  # [html] Payment step, the sentence after the title. Keep the <a> and its href.
  paymentBody: "Add your {missing} in the <a href=\"/dashboard/#credentials\">hotel back office</a>, then come back to pay."
  # Settings drawer and activity drawer. Bold first line.
  drawerTitle: "Add your Flywire demo credentials to start"
  # Drawer paragraph. {missing} is the same list as above.
  drawerBody: "This demo comes without credentials. Enter your {missing} in the hotel back office. They’re saved in this browser and only work with the Flywire demo environment."
  # Button in the drawer.
  add: "Add credentials"
  # Back office banner. Bold first line, includes the period.
  officeTitle: "Add your Flywire demo credentials to start."
