  # Link to the Flywire sample page. The arrow means "opens in a new tab".
  openPlayground: "Open in playground ↗"
  sendRequest: "Send {method} request"
  sending: "Sending…"
  requestFormat: "Request format"
  # Tab label. "curl" is a command-line tool. [do not translate]
  curl: "curl"
  nodeFetch: "Node fetch"
  requestTitle: "Request to Flywire"
  fillFields: "Fill in the fields above."
  requestFootnote: "This demo’s server sends it with your demo API key as X-Authentication-Key. The key is never shown here."
  # {when} is the booking’s creation date and time.
  created: "Created {when}"
  activity: "Activity"
  request: "Request"
  requestBody: "Request body"
  response: "Response"
  showData: "Show data"
  payment: "Payment"
  # {currency} is an ISO code.
  amountLabel: "Amount ({currency})"
  amountPositive: "Enter an amount greater than zero."
  amountMinimum: "The amount must be at least {amount}."
  whatForOffice: "What for (kept in the back office)"
  # Do not translate external_reference. It is a field name.
  externalReference: "external_reference"
  needReference: "Add an external_reference for this charge, e.g. the booking number."
  tokenFromReport: "From the session’s tokenization_report. Edit if needed."
  tokenMissing: "The card token was not in the session report. Refresh status first, or paste the token details from the Flywire portal."
  # Do not translate these three field names.
  paymentMethodToken: "payment_method_token"
  mandateId: "mandate_id"
  payorId: "payor_id"
  resumeNote: "After Flywire answers, checkout opens on this page with the new run_id and run_token."
  # {amount} is the current hold. Holds can be raised, never lowered.
  extendMinimum: "Minimum {amount}: holds can only increase."
  currencyUnavailable: "Currency unavailable"
  # {code} is USD. {name} is "US Dollar". {symbol} is " ($)" or empty.
  currencyValue: "{code} · {name}{symbol}"
  currencyUsd: "This recipient bills in USD, so room prices stay in dollars."
  # {rate} is a number. {code} is the currency. {date} is " · 2026-10-06" or empty.
  currencyRate: "1 USD = {rate} {code}{date}. Room prices and checkout amounts use this rate."
  # {who} is the recipient name and id. {detail} is the rest of the sentence.
  currencyLine: "{who}. {detail}"

  # Preset reasons when charging a saved card. Staff pick one from a menu.
  charges:
    minibar: "Minibar"
    spa: "Spa treatment"
    lateCheckout: "Late checkout"
    transfer: "Airport transfer"
    dive: "Dive equipment rental"
    noShow: "No-show fee"

  # The five staff actions. "help" is the paragraph. "reason" / "fix" show when the action cannot run.
  action:
    refresh: "Refresh status"
    refreshHelp: "Reads the session from Flywire: session, payment and tokenization reports."
    resume: "Resume session"
    resumeHelp: "Gets new run credentials for this session, then reopens checkout with them where the guest left off, e.g. to send a payment link."
    resumeOldReason: "This booking was made before resume support."
    resumeOldFix: "Make a new booking."
    capture: "Capture payment"
    captureHelp: "Collects the held funds, fully or partly (e.g. at check-in). Any uncaptured amount is released to the guest."
    extend: "Extend hold"
    extendHelp: "Resets the hold to 7 days from today and can raise the authorised amount (increase only)."
    charge: "Charge saved card"
    chargeHelp: "Charges the card saved at checkout without the guest present, e.g. minibar or a no-show fee."
    noSessionReason: "This booking used an anonymous session, so there is no session to look up or resume on the server."
    noSessionFix: "Use an authenticated session (settings drawer, Session) for new bookings."
    # {flow} is the flow name. {how} is either action.chargedImmediately or action.savedOnly.
    notHoldReason: "Flywire can only capture or extend a pre-authorised payment (a hold). This booking used “{flow}”, {how}."
    chargedImmediately: "which charged the guest straight away"
    savedOnly: "which saves the card without charging or holding anything"
    notHoldFix: "To demo it, make a booking with a hold flow: Reserve & hold, Hold & save card, Hold (guest may save card) or Hold & keep card on file."
    noPaymentReason: "There is no payment ID on this booking yet."
    noPaymentFixRefresh: "Click Refresh status after the guest completes checkout."
    noPaymentFixGuest: "The guest hasn’t completed checkout."
    # {amount} is money. {when} is a date and time.
    holdEndedReason: "{amount} was captured on {when}, which ends the hold: anything not captured was released to the guest."
    holdEndedFixCard: "For extras, use Charge saved card: this booking has the card on file."
    holdEndedFixNew: "To demo it again, make a new booking with a hold flow."
    noCardReason: "No card was saved on this booking."
    noCardFix: "Make a booking with a card-on-file flow, e.g. Save card, charge later or Pay now & save card."
    fallbackFlow: "a flow"

  # History lines written after an action. {status} is a Flywire status code (do not translate the code).
  history:
    statusRefreshed: "Status refreshed"
    statusRefreshedWith: "Status refreshed · {status}"
    statusFailed: "Status refresh failed"
    resumed: "Session resumed · checkout reopened"
    resumeFailed: "Resume failed"
    # {amount} is money. {status} is " · received" or empty.
    captured: "Captured {amount}{status}"
    holdRaised: "Hold raised to {amount} and extended 7 days"
    holdExtended: "Hold extended 7 days"
    # {amount} {what} {reference} are filled by the form. {status} is empty or " · " plus a Flywire status code.
    charged: "Charged {amount} · {what} · {reference}{status}"
    # When an action fails, the history line is rewritten. {what} is the text before the first " · ". {error} is the API message.
    failedLine: "{what} failed · {error}"
    failedSuffix: "failed"
    checkoutAfterResume: "Checkout completed after resume"
    checkoutAfterResumeStatus: "Checkout completed after resume · {status}"
    guestClosedAgain: "Guest closed checkout again"
    checkoutTimedOut: "Checkout timed out"
    # {type} is an error code. Keep on_error.
    onError: "on_error('{type}')"
    couldNotStart: "Checkout could not start: {detail}"

# -----------------------------------------------------------------------------
# Card brands and payment methods, shown next to a payment result.
# Brand names are trademarks. [do not translate] the brand names.
# "Card" / "Direct debit" / "Bank transfer" / "Online payment" are generic and should be translated.
# -----------------------------------------------------------------------------
cards:
  card: "Card"
  directDebit: "Direct debit"
  bankTransfer: "Bank transfer"
  online: "Online payment"
  visa: "Visa"
  mastercard: "Mastercard"
  amex: "American Express"
  discover: "Discover"
  jcb: "JCB"
  diners: "Diners Club"
  unionpay: "UnionPay"
  maestro: "Maestro"

# -----------------------------------------------------------------------------
# Errors thrown in the browser before checkout opens. Shown in a notice or the activity log.
# -----------------------------------------------------------------------------
sdk:
  # Shown if the Flywire script never arrives. "connect.js" is a file name. [do not translate] the file name.
  sdkMissing: "Flywire Checkout V2 SDK did not load. Is connect.js included in the page?"
  sessionCreateFailed: "Session creation failed"
  sessionLookupFailed: "Session lookup failed"
  # {message} is one of the two lines above. {status} is an HTTP status number.
  requestFailed: "{message} ({status})"
  # Recipient currency could not be read. Shown on the back office.
  currencyUnreadable: "Could not read the recipient currency."
  currencyUnreachable: "Could not reach this demo server to read the recipient currency."

# -----------------------------------------------------------------------------
# Sentences the demo server returns and the back office displays.
# They are listed so translators can prepare them. The page language is saved
# in this browser, but the server still sends the English text. Do not translate
# URLs, header names, or field names inside these
# sentences when they are written as code.
# -----------------------------------------------------------------------------
server:
  # Returned with HTTP 401 when an action is attempted before an API key is saved.
  # "/dashboard" is the back-office path. You may keep the path in parentheses.
  missingCredentials: "Add your Flywire demo credentials in the hotel back office (/dashboard) first."
  invalidSession: "Invalid session id."
  invalidPayment: "Invalid payment id."
  amountMinor: "amount must be a positive integer in minor units (cents)."
  chargeFields: "payment_method_token, mandate_id, payor_id, recipient_code and external_reference are required."
  noApiKey: "No API key entered yet."
  # {detail} is Flywire’s own rejection text, already ending with a period.
  keyRejected: "{detail} Only Flywire demo keys work here; production keys are rejected."
  keyRejectedFallback: "The API key was rejected."
  keyAccepted: "Demo API accepted this key."
  # {status} is an HTTP status number.
  apiAnswered: "Demo API answered {status}."
  apiUnreachable: "Could not reach the Flywire demo API."
  needClientId: "Enter a Client ID before the currency can be looked up."
  needRecipient: "Enter a recipient code before the currency can be looked up."
  currencyFailed: "Could not read the recipient currency."
  flywireUnreachable: "Could not reach the Flywire API"
