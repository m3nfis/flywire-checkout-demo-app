# =============================================================================
# The Caldera House — English source strings
# Locale: id
#
# This file is the source the translation team edits. The page reads it at
# runtime (see public/i18n.js). Comments are for translators and are not shown.
#
# How to read a key
# - The comment directly above a key says where it appears and any constraint.
# - Nested keys become dotted names in the app, e.g. rooms.hero.title.
#
# Rules
# - Keep every {placeholder} exactly, including the braces. The app fills them
#   in. Example: "{amount} paid in full." — translate the words, leave {amount}.
# - Keys that end in _one, _other, _two, _few, _many or _zero are plural forms.
#   {count} is the number. English only needs _one (exactly 1) and _other
#   (everything else). Add the other suffixes if your language needs them
#   (Polish, Arabic, Russian, and others). If a form is missing, the app uses
#   _other.
# - [html] means the value contains tags such as <br>, <strong>, <em>, <a> or
#   <code>. Translate the words. Leave tags, hrefs and class names unchanged.
# - [do not translate] means the value is a proper noun, brand, code or
#   endonym and must stay as written.
# - Tone: sections under "guest" voice speak to the hotel guest (warm, luxury,
#   second person). Sections marked "presenter" speak to the person running
#   the demo or the hotel back office (plain instructions).
# - Keep button and stepper labels short. Where length matters, the comment says so.
# - Do not translate API field names, URLs, currency codes, portal codes, or
#   the sample code in the integration preview. Those are not in this file.
#
# Not in this file
# - Developer documentation under public/full-docs and public/minimal-docs.
# - Code comments, console messages, and the generated checkout payload.
# =============================================================================

# -----------------------------------------------------------------------------
# Shared words used on more than one screen
# -----------------------------------------------------------------------------
common:
  # Booking total row. Short label, paired with a money amount.
  total: "Total"
  # Date the guest arrives. Short label in a summary list.
  checkIn: "Check-in"
  # Date the guest leaves. Short label in a summary list.
  checkOut: "Check-out"
  # How many people are staying. Short label in a summary list.
  guests: "Tamu"
  # The room that was booked. Short label.
  suite: "Suite"
  # Closes a popover or drawer. Button.
  done: "Selesai"
  # Restores the previous dates and guest counts. Text button in the date popover.
  reset: "Atur ulang"
  # Copies text to the clipboard. Small button. Restored after "Copied".
  copy: "Salin"
  # Shown for about a second after a copy succeeds. Same button as "Copy".
  copied: "Tersalin"
  # Shown for about a second when the browser blocks clipboard access.
  copyFailed: "Gagal menyalin"
  # Reveals a secret field (the API key). Small button. Opposite of "Hide".
  show: "Tampilkan"
  # Masks a secret field. Small button. Opposite of "Show".
  hide: "Sembunyikan"
  # Fallback when the guest has not given a name yet. Used in greetings.
  guest: "Tamu Terhormat"
  # Empty value in a definition list, e.g. a credential that has not been entered.
  notSet: "Belum diatur"
  # Word before the last item of a list: "Client ID, recipient code and API key".
  and: "dan"
  # Placeholder when a value is unknown. A single em dash. [do not translate]
  dash: "—"

# -----------------------------------------------------------------------------
# Browser tab titles
# -----------------------------------------------------------------------------
meta:
  # Browser tab title for the public booking site.
  # "The Caldera House" is the hotel name. "Oia" and "Santorini" are place names.
  # [do not translate] the hotel name and the place names. The em dash can stay.
  bookingTitle: "The Caldera House — Oia, Santorini"
  # Browser tab title for the hotel back office (staff page, not the guest page).
  # [do not translate] "The Caldera House".
  backOfficeTitle: "Back office — The Caldera House"

# -----------------------------------------------------------------------------
# Top bar of the booking site
# -----------------------------------------------------------------------------
nav:
  # Logo text. Hotel name. [do not translate]
  logo: "The Caldera House"
  # Small location label next to the logo. Place names. [do not translate]
  location: "Oia, Santorini"
  # Tooltip and screen-reader name for the heartbeat icon. Opens a presenter drawer
  # that lists what the payment checkout returned. Not part of the guest story.
  checkoutActivity: "Aktivitas Checkout"
  # Tooltip and screen-reader name for the grid icon. Opens the staff back office.
  backOffice: "Back office hotel"
  # Tooltip and screen-reader name for the gear icon. Opens presenter checkout settings.
  # {flow} is the name of the selected payment flow, e.g. "Pay in full".
  checkoutSettings: "Pengaturan Checkout"
  checkoutSettingsWithFlow: "Pengaturan Checkout · {flow}"

# -----------------------------------------------------------------------------
# Three-step progress bar under the header. Keep each label short.
# -----------------------------------------------------------------------------
stepper:
  # Step 1. Guest is choosing a room.
  selectRoom: "Pilih kamar"
  # Step 2. Guest is entering name, email and address.
  guestDetails: "Data tamu"
  # Step 3. Guest is about to pay.
  payment: "Pembayaran"

# -----------------------------------------------------------------------------
# Page 1 — room selection. Guest voice.
# -----------------------------------------------------------------------------
rooms:
  # Decorative photo behind the headline. Describe the picture, not the hotel brand.
  heroAlt: "Kubah biru Santorini yang menghadap Laut Aegean"
  # Small line above the headline. Hotel name and place. [do not translate]
  eyebrow: "The Caldera House · Oia, Santorini"
  # Main headline on the room list.
  title: "Pilih suite Anda"
  # Tooltip, screen-reader text, and the date popover name. Opens the date and guest picker.
  changeDates: "Ubah tanggal dan jumlah tamu"
  # Price suffix when the hotel bills in US dollars. Keep the leading slash.
  perNight: "/malam"
  # Price suffix when the hotel bills in another currency.
  # {currency} is an ISO code such as EUR or GBP. Do not translate the code.
  perNightWithCurrency: "/malam · {currency}"
  # Button on every room card. Keep it short enough for a card footer.
  selectSuite: "Pilih suite ini"

  # Hero line under the headline, built in script.
  # {range} is the dates, e.g. "June 12 – 15, 2026".
  # {nights} and {guests} are already-translated phrases such as "3 Nights" and "2 Guests".
  staySummary: "{range} · {nights} · {guests}"

  cards:
    royal-caldera:
      # Marketing name of the featured suite. "Caldera" is the volcanic bay at Santorini;
      # keep it. "Royal" and "Suite" may be translated.
      name: "Suite Royal Caldera"
      # Alt text for the suite photo. Same name guests see on the card.
      alt: "Suite Royal Caldera"
      # Ribbon on the photo. One word if possible.
      badge: "Rekomendasi"
      # Facts line under the name. Middle dots separate three facts. "m²" is square metres.
      specs: "120 m² · Pemandangan Caldera · Kolam renang infinity pribadi"
      # Size only, reused in the booking summary. Keep "m²".
      size: "120 m²"
      # View only, reused in the booking summary.
      view: "Pemandangan Caldera"
      # Paragraph on the card. Warm, descriptive.
      description: "Permata utama The Caldera House. Ruang peristirahatan yang luas dengan jendela dari lantai hingga langit-langit yang membingkai caldera, kolam renang infinity pribadi, dan teras yang dirancang untuk menikmati matahari terbenam paling terkenal di dunia."
      # Short amenity chips. Keep each to one or two words.
      tagPool: "Kolam pribadi"
      tagButler: "Layanan butler"
      tagTerrace: "Teras"
      tagKitchen: "Dapur koki"

    sunset-villa:
      # Marketing name. "Sunset" and "Honeymoon" may be translated. "Villa" may be translated.
      name: "Vila Bulan Madu Senja"
      alt: "Vila Bulan Madu Senja"
      specs: "95 m² · Pemandangan matahari terbenam · Bak mandi luar ruangan"
      size: "95 m²"
      view: "Pemandangan matahari terbenam"
      description: "Vila tersembunyi yang dikelilingi bunga bugenvil, dengan halaman pribadi, bak mandi tembaga luar ruangan, dan pemandangan tanpa halangan ke arah matahari terbenam legendaris di Oia."
      tagBath: "Bak mandi luar ruangan"
      tagCourtyard: "Halaman dalam"
      tagSunset: "Pemandangan senja"

    captains-quarters:
      # Marketing name. Nautical theme. The apostrophe is the hotel’s name for the room.
      name: "Kamar Kapten"
      alt: "Kamar Kapten"
      specs: "65 m² · Pemandangan pelabuhan · Kolam celup"
      size: "65 m²"
      view: "Pemandangan pelabuhan"
      description: "Terinspirasi oleh warisan bahari Santorini, dengan langit-langit melengkung bercat putih, barang antik pilihan, dan halaman pribadi dengan kolam celup."
      tagPlunge: "Kolam celup"
      tagVaulted: "Langit-langit melengkung"
      tagCourtyard: "Halaman dalam"

    aegean-studio:
      # Marketing name. "Aegean" is the sea; keep it. "Cliff" and "Studio" may be translated.
      name: "Studio Tebing Aegean"
      alt: "Studio Tebing Aegean"
      specs: "45 m² · Pemandangan laut · Balkon pribadi"
      size: "45 m²"
      view: "Pemandangan laut"
      description: "Tempat peristirahatan elegan yang dipahat di tebing vulkanik, dengan balkon pribadi yang menggantung di atas Laut Aegean. Garis-garis bersih berpadu dengan batu alam di studio rancangan arsitek ini."
      tagSea: "Pemandangan laut"
      tagBalcony: "Balkon"
      tagShower: "Pancuran hujan"

# -----------------------------------------------------------------------------
# Date and guest popover. Guest voice. Opened from "Change dates and guests".
# -----------------------------------------------------------------------------
stay:
  # Plural of nights, lowercase, used inside sentences and the price breakdown.
  # {count} is a number. See the plural rules at the top of this file.
  night_one: "{count} malam"
  night_other: "{count} malam"
  # Same idea, title case, used in the hero summary ("3 Nights").
  nightTitle_one: "{count} malam"
  nightTitle_other: "{count} malam"
  # Title case, hero summary ("2 Guests").
  guestTitle_one: "{count} tamu"
  guestTitle_other: "{count} tamu"
  # Guest count in the summary panel ("2 Adults").
  adult_one: "{count} dewasa"
  adult_other: "{count} dewasa"
  # Guest count when there are children. English "Child" / "Children" is irregular.
  child_one: "{count} anak"
  child_other: "{count} anak"
  # Extra people beyond the two guests included in the rate. Lowercase, mid-sentence.
  extraGuest_one: "{count} tamu tambahan"
  extraGuest_other: "{count} tamu tambahan"
  # Bookings count on the back office list.
  booking_one: "{count} pemesanan dibuat di situs pemesanan"
  booking_other: "{count} pemesanan dibuat di situs pemesanan"
  # Nights column in the back office table.
  nightShort_one: "{count} malam"
  nightShort_other: "{count} malam"
  # Relative time in the back office. {count} is minutes or hours.
  minutesAgo_one: "{count} menit lalu"
  minutesAgo_other: "{count} menit lalu"
  hoursAgo_one: "{count} jam lalu"
  hoursAgo_other: "{count} jam lalu"
  # Less than a minute ago.
  justNow: "baru saja"

  # Popover heading while the guest still needs to pick the departure date.
  selectCheckout: "Pilih tanggal check-out"
  # Subtitle before a departure date is chosen.
  # {checkIn} is a short date such as "Fri, Jun 12, 2026". {max} is a number (30).
  checkoutHint: "Check-in {checkIn} · maksimal {max} malam"
  # Screen-reader name for the previous-month arrow.
  previousMonth: "Bulan sebelumnya"
  # Screen-reader name for the next-month arrow.
  nextMonth: "Bulan berikutnya"
  # Stepper label. Adults are ages 13+.
  adults: "Dewasa"
  # Hint under "Adults".
  adultsHint: "Usia 13 tahun ke atas"
  # Stepper label.
  children: "Anak-anak"
  # Hint under "Children". An en dash between the ages.
  childrenHint: "Usia 2–12 tahun"
  # Note under the steppers. {guests} is a number (2). {amount} is a money amount.
  extraGuestFee: "Tarif sudah termasuk {guests} tamu. Setiap tamu tambahan dikenakan {amount} per malam."
  # Screen-reader name for the minus button. {who} is "adults" or "children", lowercase.
  removeGuests: "Kurangi jumlah {who}"
  # Screen-reader name for the plus button. {who} is "adults" or "children", lowercase.
  addGuests: "Tambah jumlah {who}"
  # Lowercase plural used only inside the screen-reader phrases above.
  adultsLower: "dewasa"
  childrenLower: "anak-anak"

  # Column headers of the month grid, Sunday through Saturday, in that order.
  # The grid starts on Sunday. Do not reorder these seven keys.
  # Keep them very short (about 2 letters in English).
  weekdaySu: "Mg"
  weekdayMo: "Sn"
  weekdayTu: "Sl"
  weekdayWe: "Rb"
  weekdayTh: "Km"
  weekdayFr: "Jm"
  weekdaySa: "Sb"

# -----------------------------------------------------------------------------
# Page 2 — guest details form. Guest voice.
# -----------------------------------------------------------------------------
guest:
  # Form heading.
  title: "Informasi tamu"
  # Line under the heading.
  subtitle: "Silakan konfirmasi data Anda untuk reservasi ini"
  # Form labels. Each sits above an empty text field.
  firstName: "Nama depan"
  lastName: "Nama belakang"
  email: "Alamat email"
  phone: "Nomor telepon"
  address: "Alamat jalan"
  city: "Kota"
  # Postal code. "ZIP" is the US term; "Postal" covers other countries. Keep both ideas.
  zip: "Kode pos"
  country: "Negara"
  # First option in the country menu, shown before a country is chosen.
  countryPlaceholder: "Pilih…"
  # Returns to the room list. The arrow is part of the label; you may use your language’s back arrow.
  backToRooms: "← Kembali ke daftar kamar"
  # Submits the form and opens the payment step. Button.
  continueToPayment: "Lanjutkan ke pembayaran"
  # Heading of the side panel that repeats the chosen room.
  yourSelection: "Pilihan Anda"

  # Country menu. The stored value is the two-letter code; only the name is translated.
  # Use the country’s usual name in your language.
  countries:
    ES: "Spanyol"
    GR: "Yunani"
    IT: "Italia"
    FR: "Prancis"
    DE: "Jerman"
    GB: "Inggris Raya"
    US: "Amerika Serikat"
    PT: "Portugal"
    NL: "Belanda"
    CH: "Swiss"
    AT: "Austria"
    BE: "Belgia"
    SE: "Swedia"
    NO: "Norwegia"
    DK: "Denmark"
    AU: "Australia"
    CA: "Kanada"
    JP: "Jepang"

# -----------------------------------------------------------------------------
# Page 3 — payment. Guest voice, plus a few presenter warnings.
# -----------------------------------------------------------------------------
booking:
  # Large photo on the payment page.
  heroAlt: "Pemandangan caldera Santorini saat matahari terbenam"
  # Three gallery captions under the payment-page photos.
  gallerySuiteAlt: "Interior Suite Royal"
  gallerySuite: "Suite Royal"
  galleryPoolAlt: "Kolam renang infinity"
  galleryPool: "Kolam renang infinity"
  galleryDiningAlt: "Santapan istimewa"
  galleryDining: "Santap privat"
  # Property story heading.
  sanctuaryTitle: "Tempat peristirahatan di atas laut"
  # First paragraph of the property story. Place names stay.
  sanctuaryBody1: "Bertengger di tebing vulkanik Oia, The Caldera House adalah tempat Laut Aegean bertemu langit. Setiap suite menawarkan pemandangan caldera tanpa halangan, dengan interior batu pahatan tangan, kolam celup pribadi, dan teras yang dirancang untuk menyaksikan matahari terbenam paling terkenal di dunia."
  # Second paragraph.
  sanctuaryBody2: "Dari makan malam diterangi cahaya lilin yang disiapkan oleh koki residen kami hingga yoga saat fajar di puncak tebing, setiap detail telah dipertimbangkan agar Anda dapat sepenuhnya menikmati momen."
  # Amenity list. Short phrases.
  amenityPool: "Kolam renang infinity pribadi"
  amenityChef: "Layanan koki di dalam suite"
  amenityTerrace: "Teras dengan pemandangan Caldera"
  amenitySpa: "Spa & kebugaran"
  amenitySailing: "Pelayaran senja"
  amenityAirport: "Layanan concierge bandara"
  # Returns to the guest form. Arrow may be mirrored in RTL languages.
  backToGuest: "← Kembali ke data tamu"
  # Side panel heading on the payment step.
  yourStay: "Masa inap Anda"
  # Heading above the payment choice.
  payment: "Pembayaran"
  # Security reassurance under the pay button.
  secured: "Semua transaksi diamankan dan dienkripsi."
  # Line under that reassurance. {name} is the guest’s full name.
  guestLine: "Tamu: {name}"
  # Tooltip on the pay button while Flywire demo credentials are missing.
  # Presenter voice — the person clicking has to open the back office first.
  credentialsFirst: "Tambahkan kredensial demo Flywire Anda di back office hotel terlebih dahulu"
  # Notice when checkout rejects the configuration. {detail} is a technical field list from Flywire.
  # Presenter voice.
  configRejected: "Checkout menolak konfigurasi ini: {detail}"
  # Notice when checkout fails to open. {detail} is the error text.
  couldNotStart: "Checkout tidak dapat dimulai: {detail}"
  # Shown in the activity log when a card is saved and no money is taken.
  noAmount: "Tanpa jumlah (hanya menyimpan kartu)"
  # Activity log value. Presenter voice. Checkout drawn on top of the page.
  displayOverlay: "Overlay layar penuh"
  # Activity log value. Checkout placed inside the booking panel.
  displayEmbedded: "Disematkan di halaman"

  # Price breakdown lines. {nights} is "3 nights". {amount} is the nightly rate.
  nightlyCalc: "{nights} × {amount}"
  # {extras} is "1 extra guest" or "2 extra guests". {amount} is the fee. {nights} is "3 nights".
  extraCalc: "{extras} × {amount} × {nights}"

# -----------------------------------------------------------------------------
# Guest-facing names for the payment flow the presenter picked.
# These replace the "Payment" card title, description and the pay button.
# {amount} is a money amount such as "$7,350" or "€6.800".
# -----------------------------------------------------------------------------
flows:
  pay_full:
    # Guest sees this as the payment option title.
    guestTitle: "Bayar penuh"
    guestDesc: "Pembayaran satu kali sebesar {amount}"
    # Pay button. {amount} is included.
    cta: "Bayar {amount}"
    # Presenter sees this in the settings drawer, as the flow name.
    title: "Bayar penuh"
    # Presenter. One sentence under the flow name.
    pitch: "Tarif prabayar, tur, dan pengalaman menit terakhir."
    # Link to a matching sample. Presenter.
    playground: "Pembayaran dengan kolom umum"

  reserve_hold:
    guestTitle: "Reservasi & tahan dana"
    guestDesc: "Pra-otorisasi {amount} hari ini, ditagih saat check-in"
    cta: "Reservasi dengan penahanan dana"
    title: "Reservasi & tahan dana"
    # "Pre-authorize" means a card hold, not a charge. "API" is the Flywire programming interface; you may keep "API".
    pitch: "Pra-otorisasi saat pemesanan, tarik dana saat check-in. Penahanan dana dapat diperpanjang atau ditambah melalui API."
    playground: "Pembayaran dengan pra-otorisasi"

  moto:
    # MOTO means Mail Order / Telephone Order: staff take the card, the guest is not on the website.
    # You may spell that out if the abbreviation is unknown, but keep it short (it is a menu title).
    guestTitle: "Pembayaran melalui bagian reservasi"
    guestDesc: "Pembayaran {amount} dibantu petugas"
    cta: "Terima pembayaran {amount}"
    title: "Pemesanan via telepon & email (MOTO)"
    pitch: "Staf reservasi menerima pembayaran untuk tamu yang memesan melalui telepon atau email."
    playground: "Pembayaran MOTO"

  save_card:
    guestTitle: "Jaminan dengan kartu"
    guestDesc: "Kartu Anda menjamin pemesanan ini. Tidak ada tagihan hari ini."
    cta: "Simpan kartu & reservasi"
    title: "Simpan kartu, tagih nanti"
    pitch: "Jaminan kartu tersimpan. Tagih deposit, sisa pembayaran, atau biaya no-show nanti dengan token."
    playground: "Tokenisasi tanpa jumlah"

  pay_save:
    guestTitle: "Bayar & simpan kartu"
    guestDesc: "Bayar {amount} sekarang; kartu disimpan untuk biaya tambahan"
    cta: "Bayar {amount} & simpan kartu"
    title: "Bayar sekarang & simpan kartu"
    pitch: "Tagih sekarang dan simpan kartu untuk biaya tambahan: peralatan selam, spa, ekskursi, sisa pembayaran."
    playground: "Tokenisasi dengan jumlah"

  hold_save:
    guestTitle: "Tahan dana & simpan kartu"
    guestDesc: "Pra-otorisasi {amount}; kartu disimpan untuk tagihan akhir Anda"
    cta: "Reservasi dengan penahanan dana"
    title: "Tahan dana & simpan kartu"
    pitch: "Pra-otorisasi biaya menginap dan simpan kartu untuk tagihan akhir serta biaya insidental."
    playground: "Tokenisasi dengan pra-otorisasi"

  optional:
    guestTitle: "Bayar penuh"
    guestDesc: "Pembayaran satu kali sebesar {amount}, dengan opsi menyimpan kartu Anda"
    cta: "Bayar {amount}"
    title: "Bayar, tamu dapat menyimpan kartu"
    pitch: "Tamu memutuskan apakah akan menyimpan kartu untuk perjalanan berikutnya. Sangat cocok untuk tamu yang kembali menginap."
    playground: "Tokenisasi opsional"

  optional_hold:
    guestTitle: "Reservasi & tahan dana"
    guestDesc: "Pra-otorisasi {amount}, dengan opsi menyimpan kartu Anda"
    cta: "Reservasi dengan penahanan dana"
    title: "Tahan dana, tamu dapat menyimpan kartu"
    pitch: "Pra-otorisasi biaya menginap; tamu dapat memilih untuk menyimpan kartu."
    playground: "Tokenisasi opsional dengan pra-otorisasi"

  implicit:
    guestTitle: "Bayar penuh"
    guestDesc: "Pembayaran satu kali sebesar {amount}; kartu disimpan selama Anda menginap"
    cta: "Bayar {amount}"
    title: "Bayar & kartu tersimpan"
    pitch: "Kartu disimpan secara otomatis jika metode pembayaran mendukung. Ideal untuk pelunasan sisa tagihan dan rencana cicilan."
    playground: "Tokenisasi implisit"

  implicit_hold:
    guestTitle: "Reservasi & tahan dana"
    guestDesc: "Pra-otorisasi {amount}; kartu disimpan selama Anda menginap"
    cta: "Reservasi dengan penahanan dana"
    title: "Tahan dana & kartu tersimpan"
    pitch: "Pra-otorisasi biaya menginap dan simpan kartu secara otomatis untuk tagihan berikutnya."
    playground: "Tokenisasi implisit dengan pra-otorisasi"

  # Extra sentence under the payment option when part of the money goes to partners.
  # {parts} is a list such as "sunset catamaran excursion ($350) and couples spa ritual ($250)".
  splitNote: "Termasuk {parts}, yang diselesaikan langsung dengan mitra kami."
  # Joiner used inside {parts} before the last partner. Same role as common.and, kept here
  # because it sits inside a guest sentence.
  splitAnd: "dan"
  # Extra sentence when the hotel absorbs the card fee.
  noSurcharge: "Tanpa biaya tambahan kartu."

  # Presenter. Group headings in the flow list.
  groups:
    payment: "Pembayaran"
    tokenization: "Kartu tersimpan"
    # Grey hint after the group name. Technical term for saving a card.
    tokenizationHint: "Tokenisasi"
    optional: "Tamu memilih menyimpan kartu"
    optionalHint: "Tokenisasi opsional"
    implicit: "Kartu tersimpan otomatis"
    implicitHint: "Tokenisasi implisit"
  # Presenter. Badge when a flow cannot be selected until an API key is saved.
  needsApiKey: "Memerlukan kunci API"
  # Presenter. Appended to the technical summary when the flow does not charge now.
  noAmountTech: "tanpa jumlah"

  # Presenter. Extra sample links that appear when the matching setting is on.
  playground:
    authenticated: "Pembayaran dengan sesi terautentikasi"
    embedded: "Pembayaran tersemat"
    split: "Pembayaran dengan pembagian dana"
    waive: "Pembayaran tanpa biaya tambahan"
    offerRules: "Pembayaran dengan aturan penawaran"
    styles: "Pembayaran dengan gaya kustom"
    timeout: "Pembayaran dengan batas waktu"
    docs: "Panduan konfigurasi Checkout V2"

# -----------------------------------------------------------------------------
# Confirmation page after a successful checkout. Guest voice.
# -----------------------------------------------------------------------------
success:
  # Photo behind the confirmation.
  backgroundAlt: "Matahari terbenam di Santorini"
