  sessionCreateFailed: "Tạo phiên thất bại"
  sessionLookupFailed: "Tra cứu phiên thất bại"
  # {message} is one of the two lines above. {status} is an HTTP status number.
  requestFailed: "{message} ({status})"
  # Recipient currency could not be read. Shown on the back office.
  currencyUnreadable: "Không thể đọc tiền tệ của bên nhận."
  currencyUnreachable: "Không thể kết nối đến máy chủ demo này để đọc tiền tệ của bên nhận."

