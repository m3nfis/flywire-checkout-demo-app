# =============================================================================
# The Caldera House — English source strings
# Locale: zh
#
# This file is the source the translation team edits. The page reads it at
# runtime (see public/i18n.js). Comments are for translators and are not shown.
#
# How to read a key
# - The comment directly above a key says where it appears and any constraint.
# - Nested keys become dotted names in the app, e.g. rooms.hero.title.
#
# Rules
# - Keep every {placeholder} exactly, including the braces. The app fills them
#   in. Example: "{amount} paid in full." — translate the words, leave {amount}.
# - Keys that end in _one, _other, _two, _few, _many or _zero are plural forms.
#   {count} is the number. English only needs _one (exactly 1) and _other
#   (everything else). Add the other suffixes if your language needs them
#   (Polish, Arabic, Russian, and others). If a form is missing, the app uses
#   _other.
# - [html] means the value contains tags such as <br>, <strong>, <em>, <a> or
#   <code>. Translate the words. Leave tags, hrefs and class names unchanged.
# - [do not translate] means the value is a proper noun, brand, code or
#   endonym and must stay as written.
# - Tone: sections under "guest" voice speak to the hotel guest (warm, luxury,
#   second person). Sections marked "presenter" speak to the person running
#   the demo or the hotel back office (plain instructions).
# - Keep button and stepper labels short. Where length matters, the comment says so.
# - Do not translate API field names, URLs, currency codes, portal codes, or
#   the sample code in the integration preview. Those are not in this file.
#
# Not in this file
# - Developer documentation under public/full-docs and public/minimal-docs.
# - Code comments, console messages, and the generated checkout payload.
# =============================================================================

# -----------------------------------------------------------------------------
# Shared words used on more than one screen
# -----------------------------------------------------------------------------
common:
  # Booking total row. Short label, paired with a money amount.
  total: "总计"
  # Date the guest arrives. Short label in a summary list.
  checkIn: "入住"
  # Date the guest leaves. Short label in a summary list.
  checkOut: "退房"
  # How many people are staying. Short label in a summary list.
  guests: "住客"
  # The room that was booked. Short label.
  suite: "套房"
  # Closes a popover or drawer. Button.
  done: "完成"
  # Restores the previous dates and guest counts. Text button in the date popover.
  reset: "重置"
  # Copies text to the clipboard. Small button. Restored after "Copied".
  copy: "复制"
  # Shown for about a second after a copy succeeds. Same button as "Copy".
  copied: "已复制"
  # Shown for about a second when the browser blocks clipboard access.
  copyFailed: "复制失败"
  # Reveals a secret field (the API key). Small button. Opposite of "Hide".
  show: "显示"
  # Masks a secret field. Small button. Opposite of "Show".
  hide: "隐藏"
  # Fallback when the guest has not given a name yet. Used in greetings.
  guest: "贵宾"
  # Empty value in a definition list, e.g. a credential that has not been entered.
  notSet: "未设置"
  # Word before the last item of a list: "Client ID, recipient code and API key".
  and: "和"
  # Placeholder when a value is unknown. A single em dash. [do not translate]
  dash: "—"

# -----------------------------------------------------------------------------
# Browser tab titles
# -----------------------------------------------------------------------------
meta:
  # Browser tab title for the public booking site.
  # "The Caldera House" is the hotel name. "Oia" and "Santorini" are place names.
  # [do not translate] the hotel name and the place names. The em dash can stay.
  bookingTitle: "The Caldera House — Oia, Santorini"
  # Browser tab title for the hotel back office (staff page, not the guest page).
  # [do not translate] "The Caldera House".
  backOfficeTitle: "酒店后台 — The Caldera House"

# -----------------------------------------------------------------------------
# Top bar of the booking site
# -----------------------------------------------------------------------------
nav:
  # Logo text. Hotel name. [do not translate]
  logo: "The Caldera House"
  # Small location label next to the logo. Place names. [do not translate]
  location: "Oia, Santorini"
  # Tooltip and screen-reader name for the heartbeat icon. Opens a presenter drawer
  # that lists what the payment checkout returned. Not part of the guest story.
  checkoutActivity: "Checkout 活动记录"
  # Tooltip and screen-reader name for the grid icon. Opens the staff back office.
  backOffice: "酒店后台"
  # Tooltip and screen-reader name for the gear icon. Opens presenter checkout settings.
  # {flow} is the name of the selected payment flow, e.g. "Pay in full".
  checkoutSettings: "Checkout 设置"
  checkoutSettingsWithFlow: "Checkout 设置 · {flow}"

# -----------------------------------------------------------------------------
# Three-step progress bar under the header. Keep each label short.
# -----------------------------------------------------------------------------
stepper:
  # Step 1. Guest is choosing a room.
  selectRoom: "选择客房"
  # Step 2. Guest is entering name, email and address.
  guestDetails: "住客信息"
  # Step 3. Guest is about to pay.
  payment: "付款"

# -----------------------------------------------------------------------------
# Page 1 — room selection. Guest voice.
# -----------------------------------------------------------------------------
rooms:
  # Decorative photo behind the headline. Describe the picture, not the hotel brand.
  heroAlt: "Santorini 的蓝色圆顶，俯瞰 Aegean 海"
  # Small line above the headline. Hotel name and place. [do not translate]
  eyebrow: "The Caldera House · Oia, Santorini"
  # Main headline on the room list.
  title: "选择您的套房"
  # Tooltip, screen-reader text, and the date popover name. Opens the date and guest picker.
  changeDates: "更改日期和住客人数"
  # Price suffix when the hotel bills in US dollars. Keep the leading slash.
  perNight: "/晚"
  # Price suffix when the hotel bills in another currency.
  # {currency} is an ISO code such as EUR or GBP. Do not translate the code.
  perNightWithCurrency: "/晚 · {currency}"
  # Button on every room card. Keep it short enough for a card footer.
  selectSuite: "选择此套房"

  # Hero line under the headline, built in script.
  # {range} is the dates, e.g. "June 12 – 15, 2026".
  # {nights} and {guests} are already-translated phrases such as "3 Nights" and "2 Guests".
  staySummary: "{range} · {nights} · {guests}"

  cards:
    royal-caldera:
      # Marketing name of the featured suite. "Caldera" is the volcanic bay at Santorini;
      # keep it. "Royal" and "Suite" may be translated.
      name: "皇家 Caldera 套房"
      # Alt text for the suite photo. Same name guests see on the card.
      alt: "皇家 Caldera 套房"
      # Ribbon on the photo. One word if possible.
      badge: "推荐"
      # Facts line under the name. Middle dots separate three facts. "m²" is square metres.
      specs: "120 m² · Caldera 景观 · 私人无边泳池"
      # Size only, reused in the booking summary. Keep "m²".
      size: "120 m²"
      # View only, reused in the booking summary.
      view: "Caldera 景观"
      # Paragraph on the card. Warm, descriptive.
      description: "The Caldera House 的瑰宝之作。宽敞静谧的私享空间配有落地窗，将 Caldera 美景尽收眼底，另设私人无边泳池，以及专为欣赏世界上最负盛名的日落而设计的露台。"
      # Short amenity chips. Keep each to one or two words.
      tagPool: "私人泳池"
      tagButler: "管家服务"
      tagTerrace: "露台"
      tagKitchen: "主厨厨房"

    sunset-villa:
      # Marketing name. "Sunset" and "Honeymoon" may be translated. "Villa" may be translated.
      name: "日落蜜月别墅"
      alt: "日落蜜月别墅"
      specs: "95 m² · 日落景观 · 户外浴缸"
      size: "95 m²"
      view: "日落景观"
      description: "一座掩映于九重葛花丛中的私密别墅，拥有私人庭院和户外铜制浴缸，可一览无余地欣赏 Oia 传奇般的日落。"
      tagBath: "户外浴缸"
      tagCourtyard: "庭院"
      tagSunset: "日落景观"

    captains-quarters:
      # Marketing name. Nautical theme. The apostrophe is the hotel’s name for the room.
      name: "船长居所"
      alt: "船长居所"
      specs: "65 m² · 港湾景观 · 浸泡泳池"
      size: "65 m²"
      view: "港湾景观"
      description: "灵感源自 Santorini 的航海传统，设有白色拱顶天花板、精心挑选的古董家具，以及带浸泡泳池的私人庭院。"
      tagPlunge: "浸泡泳池"
      tagVaulted: "拱形天花板"
      tagCourtyard: "庭院"

    aegean-studio:
      # Marketing name. "Aegean" is the sea; keep it. "Cliff" and "Studio" may be translated.
      name: "Aegean 崖畔开间套房"
      alt: "Aegean 崖畔开间套房"
      specs: "45 m² · 海景 · 私人阳台"
      size: "45 m²"
      view: "海景"
      description: "一处依火山悬崖而建的精致居所，私人阳台悬于 Aegean 海之上。在这间由建筑师设计的开间套房中，简洁线条与天然石材交相辉映。"
      tagSea: "海景"
      tagBalcony: "阳台"
      tagShower: "雨淋花洒"

# -----------------------------------------------------------------------------
# Date and guest popover. Guest voice. Opened from "Change dates and guests".
# -----------------------------------------------------------------------------
stay:
  # Plural of nights, lowercase, used inside sentences and the price breakdown.
  # {count} is a number. See the plural rules at the top of this file.
  night_one: "{count} 晚"
  night_other: "{count} 晚"
  # Same idea, title case, used in the hero summary ("3 Nights").
  nightTitle_one: "{count} 晚"
  nightTitle_other: "{count} 晚"
  # Title case, hero summary ("2 Guests").
  guestTitle_one: "{count} 位住客"
  guestTitle_other: "{count} 位住客"
  # Guest count in the summary panel ("2 Adults").
  adult_one: "{count} 位成人"
  adult_other: "{count} 位成人"
  # Guest count when there are children. English "Child" / "Children" is irregular.
  child_one: "{count} 位儿童"
  child_other: "{count} 位儿童"
  # Extra people beyond the two guests included in the rate. Lowercase, mid-sentence.
  extraGuest_one: "{count} 位额外住客"
  extraGuest_other: "{count} 位额外住客"
  # Bookings count on the back office list.
  booking_one: "预订网站上共有 {count} 笔预订"
  booking_other: "预订网站上共有 {count} 笔预订"
  # Nights column in the back office table.
  nightShort_one: "{count} 晚"
  nightShort_other: "{count} 晚"
  # Relative time in the back office. {count} is minutes or hours.
  minutesAgo_one: "{count} 分钟前"
  minutesAgo_other: "{count} 分钟前"
  hoursAgo_one: "{count} 小时前"
  hoursAgo_other: "{count} 小时前"
  # Less than a minute ago.
  justNow: "刚刚"

  # Popover heading while the guest still needs to pick the departure date.
  selectCheckout: "请选择退房日期"
  # Subtitle before a departure date is chosen.
  # {checkIn} is a short date such as "Fri, Jun 12, 2026". {max} is a number (30).
  checkoutHint: "入住 {checkIn} · 最多 {max} 晚"
  # Screen-reader name for the previous-month arrow.
  previousMonth: "上个月"
  # Screen-reader name for the next-month arrow.
  nextMonth: "下个月"
  # Stepper label. Adults are ages 13+.
  adults: "成人"
  # Hint under "Adults".
  adultsHint: "13 岁及以上"
  # Stepper label.
  children: "儿童"
  # Hint under "Children". An en dash between the ages.
  childrenHint: "2–12 岁"
  # Note under the steppers. {guests} is a number (2). {amount} is a money amount.
  extraGuestFee: "房价包含 {guests} 位住客。每位额外住客每晚收费 {amount}。"
  # Screen-reader name for the minus button. {who} is "adults" or "children", lowercase.
  removeGuests: "减少{who}人数"
  # Screen-reader name for the plus button. {who} is "adults" or "children", lowercase.
  addGuests: "增加{who}人数"
  # Lowercase plural used only inside the screen-reader phrases above.
  adultsLower: "成人"
  childrenLower: "儿童"

  # Column headers of the month grid, Sunday through Saturday, in that order.
  # The grid starts on Sunday. Do not reorder these seven keys.
  # Keep them very short (about 2 letters in English).
  weekdaySu: "日"
  weekdayMo: "一"
  weekdayTu: "二"
  weekdayWe: "三"
  weekdayTh: "四"
  weekdayFr: "五"
  weekdaySa: "六"

# -----------------------------------------------------------------------------
# Page 2 — guest details form. Guest voice.
# -----------------------------------------------------------------------------
guest:
  # Form heading.
  title: "住客信息"
  # Line under the heading.
  subtitle: "请确认您的预订信息"
  # Form labels. Each sits above an empty text field.
  firstName: "名"
  lastName: "姓"
  email: "电子邮箱"
  phone: "电话号码"
  address: "街道地址"
  city: "城市"
  # Postal code. "ZIP" is the US term; "Postal" covers other countries. Keep both ideas.
  zip: "邮政编码"
  country: "国家/地区"
  # First option in the country menu, shown before a country is chosen.
  countryPlaceholder: "请选择…"
  # Returns to the room list. The arrow is part of the label; you may use your language’s back arrow.
  backToRooms: "← 返回客房列表"
  # Submits the form and opens the payment step. Button.
  continueToPayment: "继续付款"
  # Heading of the side panel that repeats the chosen room.
  yourSelection: "您的选择"

  # Country menu. The stored value is the two-letter code; only the name is translated.
  # Use the country’s usual name in your language.
  countries:
    ES: "西班牙"
    GR: "希腊"
    IT: "意大利"
    FR: "法国"
    DE: "德国"
    GB: "英国"
    US: "美国"
    PT: "葡萄牙"
    NL: "荷兰"
    CH: "瑞士"
    AT: "奥地利"
    BE: "比利时"
    SE: "瑞典"
    NO: "挪威"
    DK: "丹麦"
    AU: "澳大利亚"
    CA: "加拿大"
    JP: "日本"

# -----------------------------------------------------------------------------
# Page 3 — payment. Guest voice, plus a few presenter warnings.
# -----------------------------------------------------------------------------
booking:
  # Large photo on the payment page.
  heroAlt: "日落时分的 Santorini Caldera 景色"
  # Three gallery captions under the payment-page photos.
  gallerySuiteAlt: "皇家套房内景"
  gallerySuite: "皇家套房"
  galleryPoolAlt: "无边泳池"
  galleryPool: "无边泳池"
  galleryDiningAlt: "精致餐饮"
  galleryDining: "私人餐饮"
  # Property story heading.
  sanctuaryTitle: "临海之上的静谧之所"
  # First paragraph of the property story. Place names stay.
  sanctuaryBody1: "The Caldera House 坐落于 Oia 的火山悬崖之上，是 Aegean 海与天空交汇之处。每间套房均可尽览 Caldera 的壮阔景致，配有手工雕琢的石砌内饰、私人浸泡泳池，以及专为欣赏世界上最负盛名的日落而设计的露台。"
  # Second paragraph.
  sanctuaryBody2: "从驻店主厨精心烹制的烛光晚餐，到崖顶的晨曦瑜伽，每一处细节都经过悉心考量，让您尽情享受当下。"
  # Amenity list. Short phrases.
  amenityPool: "私人无边泳池"
  amenityChef: "套房内主厨服务"
  amenityTerrace: "Caldera 景观露台"
  amenitySpa: "水疗与健康"
  amenitySailing: "日落帆船之旅"
  amenityAirport: "机场礼宾服务"
  # Returns to the guest form. Arrow may be mirrored in RTL languages.
  backToGuest: "← 返回住客信息"
  # Side panel heading on the payment step.
  yourStay: "您的住宿"
  # Heading above the payment choice.
  payment: "付款"
  # Security reassurance under the pay button.
  secured: "所有交易均经过安全加密。"
  # Line under that reassurance. {name} is the guest’s full name.
  guestLine: "住客：{name}"
  # Tooltip on the pay button while Flywire demo credentials are missing.
  # Presenter voice — the person clicking has to open the back office first.
  credentialsFirst: "请先在酒店后台添加您的 Flywire 演示凭据"
  # Notice when checkout rejects the configuration. {detail} is a technical field list from Flywire.
  # Presenter voice.
  configRejected: "Checkout 拒绝了此配置：{detail}"
  # Notice when checkout fails to open. {detail} is the error text.
  couldNotStart: "Checkout 无法启动：{detail}"
  # Shown in the activity log when a card is saved and no money is taken.
  noAmount: "无金额（仅保存银行卡）"
  # Activity log value. Presenter voice. Checkout drawn on top of the page.
  displayOverlay: "全屏浮层"
  # Activity log value. Checkout placed inside the booking panel.
  displayEmbedded: "嵌入页面"

  # Price breakdown lines. {nights} is "3 nights". {amount} is the nightly rate.
  nightlyCalc: "{nights} × {amount}"
  # {extras} is "1 extra guest" or "2 extra guests". {amount} is the fee. {nights} is "3 nights".
  extraCalc: "{extras} × {amount} × {nights}"

# -----------------------------------------------------------------------------
# Guest-facing names for the payment flow the presenter picked.
# These replace the "Payment" card title, description and the pay button.
# {amount} is a money amount such as "$7,350" or "€6.800".
# -----------------------------------------------------------------------------
flows:
  pay_full:
    # Guest sees this as the payment option title.
    guestTitle: "全额付款"
    guestDesc: "一次性支付 {amount}"
    # Pay button. {amount} is included.
    cta: "支付 {amount}"
    # Presenter sees this in the settings drawer, as the flow name.
    title: "全额付款"
    # Presenter. One sentence under the flow name.
    pitch: "适用于预付房价，以及临时预订的游览和体验项目。"
    # Link to a matching sample. Presenter.
    playground: "含常用字段的付款"

  reserve_hold:
    guestTitle: "预订并预授权"
    guestDesc: "今日预授权 {amount}，入住时扣款"
    cta: "以预授权方式预订"
    title: "预订并预授权"
    # "Pre-authorize" means a card hold, not a charge. "API" is the Flywire programming interface; you may keep "API".
    pitch: "预订时预授权，入住时请款。预授权可通过 API 延期或提高金额。"
    playground: "预授权付款"

  moto:
    # MOTO means Mail Order / Telephone Order: staff take the card, the guest is not on the website.
    # You may spell that out if the abbreviation is unknown, but keep it short (it is a menu title).
    guestTitle: "预订部代收付款"
    guestDesc: "由工作人员协助支付 {amount}"
    cta: "收取 {amount}"
    title: "电话和邮件预订（MOTO）"
    pitch: "预订部员工为通过电话或邮件预订的住客代收付款。"
    playground: "MOTO 付款"

  save_card:
    guestTitle: "银行卡担保"
    guestDesc: "您的银行卡将用于担保此预订，今日不会扣款。"
    cta: "保存银行卡并预订"
    title: "保存银行卡，稍后扣款"
    pitch: "以留存银行卡作担保。之后可凭令牌收取订金、尾款或未入住费用。"
    playground: "无金额令牌化"

  pay_save:
    guestTitle: "付款并保存银行卡"
    guestDesc: "立即支付 {amount}；银行卡将留存用于额外消费"
    cta: "支付 {amount} 并保存银行卡"
    title: "立即付款并保存银行卡"
    pitch: "立即扣款并留存银行卡，用于额外消费：潜水装备、水疗、短途游览、尾款。"
    playground: "含金额令牌化"

  hold_save:
    guestTitle: "预授权并保存银行卡"
    guestDesc: "预授权 {amount}；银行卡将留存用于您的最终账单"
    cta: "以预授权方式预订"
    title: "预授权并保存银行卡"
    pitch: "预授权住宿费用，并留存银行卡用于最终账单和杂费。"
    playground: "预授权令牌化"

  optional:
    guestTitle: "全额付款"
    guestDesc: "一次性支付 {amount}，可选择保存您的银行卡"
    cta: "支付 {amount}"
    title: "付款，住客可选择保存银行卡"
    pitch: "由住客决定是否为下次旅行保存银行卡。非常适合回头客。"
    playground: "可选令牌化"

  optional_hold:
    guestTitle: "预订并预授权"
    guestDesc: "预授权 {amount}，可选择保存您的银行卡"
    cta: "以预授权方式预订"
    title: "预授权，住客可选择保存银行卡"
    pitch: "预授权住宿费用；住客可自行选择是否留存银行卡。"
    playground: "可选预授权令牌化"

  implicit:
    guestTitle: "全额付款"
    guestDesc: "一次性支付 {amount}；银行卡将在您入住期间留存"
    cta: "支付 {amount}"
    title: "付款并留存银行卡"
    pitch: "当支付方式支持时，银行卡将自动保存。非常适合尾款支付和分期付款计划。"
    playground: "隐式令牌化"

  implicit_hold:
    guestTitle: "预订并预授权"
    guestDesc: "预授权 {amount}；银行卡将在您入住期间留存"
    cta: "以预授权方式预订"
    title: "预授权并留存银行卡"
    pitch: "预授权住宿费用，并自动保存银行卡以便后续扣款。"
    playground: "隐式预授权令牌化"

  # Extra sentence under the payment option when part of the money goes to partners.
  # {parts} is a list such as "sunset catamaran excursion ($350) and couples spa ritual ($250)".
  splitNote: "包含 {parts}，将由我们的合作伙伴直接结算。"
  # Joiner used inside {parts} before the last partner. Same role as common.and, kept here
  # because it sits inside a guest sentence.
