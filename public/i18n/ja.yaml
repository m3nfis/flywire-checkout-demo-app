# -----------------------------------------------------------------------------
server:
  # Returned with HTTP 401 when an action is attempted before an API key is saved.
  # "/dashboard" is the back-office path. You may keep the path in parentheses.
  missingCredentials: "先にホテルのバックオフィス（/dashboard）で Flywire デモ認証情報を追加してください。"
  invalidSession: "セッションIDが無効です。"
  invalidPayment: "支払いIDが無効です。"
  amountMinor: "amount は最小通貨単位（セント）の正の整数で指定してください。"
  chargeFields: "payment_method_token、mandate_id、payor_id、recipient_code、external_reference は必須です。"
  noApiKey: "APIキーがまだ入力されていません。"
  # {detail} is Flywire’s own rejection text, already ending with a period.
  keyRejected: "{detail} ここで使用できるのは Flywire のデモ用キーのみです。本番用キーは拒否されます。"
  keyRejectedFallback: "APIキーが拒否されました。"
  keyAccepted: "デモ API がこのキーを承認しました。"
  # {status} is an HTTP status number.
  apiAnswered: "デモ API の応答：{status}。"
  apiUnreachable: "Flywire デモ API に接続できませんでした。"
  needClientId: "通貨を照会する前に、クライアントIDを入力してください。"
  needRecipient: "通貨を照会する前に、受取人コードを入力してください。"
  currencyFailed: "受取人の通貨を読み取れませんでした。"
