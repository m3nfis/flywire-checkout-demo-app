# =============================================================================
# The Caldera House — English source strings
# Locale: fr-CA
#
# This file is the source the translation team edits. The page reads it at
# runtime (see public/i18n.js). Comments are for translators and are not shown.
#
# How to read a key
# - The comment directly above a key says where it appears and any constraint.
# - Nested keys become dotted names in the app, e.g. rooms.hero.title.
#
# Rules
# - Keep every {placeholder} exactly, including the braces. The app fills them
#   in. Example: "{amount} paid in full." — translate the words, leave {amount}.
# - Keys that end in _one, _other, _two, _few, _many or _zero are plural forms.
#   {count} is the number. English only needs _one (exactly 1) and _other
#   (everything else). Add the other suffixes if your language needs them
#   (Polish, Arabic, Russian, and others). If a form is missing, the app uses
#   _other.
# - [html] means the value contains tags such as <br>, <strong>, <em>, <a> or
#   <code>. Translate the words. Leave tags, hrefs and class names unchanged.
# - [do not translate] means the value is a proper noun, brand, code or
#   endonym and must stay as written.
# - Tone: sections under "guest" voice speak to the hotel guest (warm, luxury,
#   second person). Sections marked "presenter" speak to the person running
#   the demo or the hotel back office (plain instructions).
# - Keep button and stepper labels short. Where length matters, the comment says so.
# - Do not translate API field names, URLs, currency codes, portal codes, or
#   the sample code in the integration preview. Those are not in this file.
#
# Not in this file
# - Developer documentation under public/full-docs and public/minimal-docs.
# - Code comments, console messages, and the generated checkout payload.
# =============================================================================

# -----------------------------------------------------------------------------
# Shared words used on more than one screen
# -----------------------------------------------------------------------------
common:
  # Booking total row. Short label, paired with a money amount.
  total: "Total"
  # Date the guest arrives. Short label in a summary list.
  checkIn: "Arrivée"
  # Date the guest leaves. Short label in a summary list.
  checkOut: "Départ"
  # How many people are staying. Short label in a summary list.
  guests: "Voyageurs"
  # The room that was booked. Short label.
  suite: "Suite"
  # Closes a popover or drawer. Button.
  done: "Terminé"
  # Restores the previous dates and guest counts. Text button in the date popover.
  reset: "Réinitialiser"
  # Copies text to the clipboard. Small button. Restored after "Copied".
  copy: "Copier"
  # Shown for about a second after a copy succeeds. Same button as "Copy".
  copied: "Copié"
  # Shown for about a second when the browser blocks clipboard access.
  copyFailed: "Échec de la copie"
  # Reveals a secret field (the API key). Small button. Opposite of "Hide".
  show: "Afficher"
  # Masks a secret field. Small button. Opposite of "Show".
  hide: "Masquer"
  # Fallback when the guest has not given a name yet. Used in greetings.
  guest: "Voyageur"
  # Empty value in a definition list, e.g. a credential that has not been entered.
  notSet: "Non défini"
  # Word before the last item of a list: "Client ID, recipient code and API key".
  and: "et"
  # Placeholder when a value is unknown. A single em dash. [do not translate]
  dash: "—"

# -----------------------------------------------------------------------------
# Browser tab titles
# -----------------------------------------------------------------------------
meta:
  # Browser tab title for the public booking site.
  # "The Caldera House" is the hotel name. "Oia" and "Santorini" are place names.
  # [do not translate] the hotel name and the place names. The em dash can stay.
  bookingTitle: "The Caldera House — Oia, Santorini"
  # Browser tab title for the hotel back office (staff page, not the guest page).
  # [do not translate] "The Caldera House".
  backOfficeTitle: "Back-office — The Caldera House"

# -----------------------------------------------------------------------------
# Top bar of the booking site
# -----------------------------------------------------------------------------
nav:
  # Logo text. Hotel name. [do not translate]
  logo: "The Caldera House"
  # Small location label next to the logo. Place names. [do not translate]
  location: "Oia, Santorini"
  # Tooltip and screen-reader name for the heartbeat icon. Opens a presenter drawer
  # that lists what the payment checkout returned. Not part of the guest story.
  checkoutActivity: "Activité de Checkout"
  # Tooltip and screen-reader name for the grid icon. Opens the staff back office.
  backOffice: "Back-office de l’hôtel"
  # Tooltip and screen-reader name for the gear icon. Opens presenter checkout settings.
  # {flow} is the name of the selected payment flow, e.g. "Pay in full".
  checkoutSettings: "Paramètres de Checkout"
  checkoutSettingsWithFlow: "Paramètres de Checkout · {flow}"

# -----------------------------------------------------------------------------
# Three-step progress bar under the header. Keep each label short.
# -----------------------------------------------------------------------------
stepper:
  # Step 1. Guest is choosing a room.
  selectRoom: "Choix de la suite"
  # Step 2. Guest is entering name, email and address.
  guestDetails: "Coordonnées du voyageur"
  # Step 3. Guest is about to pay.
  payment: "Paiement"

# -----------------------------------------------------------------------------
# Page 1 — room selection. Guest voice.
# -----------------------------------------------------------------------------
rooms:
  # Decorative photo behind the headline. Describe the picture, not the hotel brand.
  heroAlt: "Dômes bleus de Santorini surplombant l’Aegean"
  # Small line above the headline. Hotel name and place. [do not translate]
  eyebrow: "The Caldera House · Oia, Santorini"
  # Main headline on the room list.
  title: "Choisissez votre suite"
  # Tooltip, screen-reader text, and the date popover name. Opens the date and guest picker.
  changeDates: "Modifier les dates et les voyageurs"
  # Price suffix when the hotel bills in US dollars. Keep the leading slash.
  perNight: "/nuit"
  # Price suffix when the hotel bills in another currency.
  # {currency} is an ISO code such as EUR or GBP. Do not translate the code.
  perNightWithCurrency: "/nuit · {currency}"
  # Button on every room card. Keep it short enough for a card footer.
  selectSuite: "Choisir cette suite"

  # Hero line under the headline, built in script.
  # {range} is the dates, e.g. "June 12 – 15, 2026".
  # {nights} and {guests} are already-translated phrases such as "3 Nights" and "2 Guests".
  staySummary: "{range} · {nights} · {guests}"

  cards:
    royal-caldera:
      # Marketing name of the featured suite. "Caldera" is the volcanic bay at Santorini;
      # keep it. "Royal" and "Suite" may be translated.
      name: "Suite royale Caldera"
      # Alt text for the suite photo. Same name guests see on the card.
      alt: "Suite royale Caldera"
      # Ribbon on the photo. One word if possible.
      badge: "Recommandée"
      # Facts line under the name. Middle dots separate three facts. "m²" is square metres.
      specs: "120 m² · Vue sur la Caldera · Piscine à débordement privée"
      # Size only, reused in the booking summary. Keep "m²".
      size: "120 m²"
      # View only, reused in the booking summary.
      view: "Vue sur la Caldera"
      # Paragraph on the card. Warm, descriptive.
      description: "Le joyau de The Caldera House. Un vaste sanctuaire dont les fenêtres du plancher au plafond encadrent la caldera, avec une piscine à débordement privée et une terrasse pensée pour le coucher de soleil le plus célèbre au monde."
      # Short amenity chips. Keep each to one or two words.
      tagPool: "Piscine privée"
      tagButler: "Service de majordome"
      tagTerrace: "Terrasse"
      tagKitchen: "Cuisine du chef"

    sunset-villa:
      # Marketing name. "Sunset" and "Honeymoon" may be translated. "Villa" may be translated.
      name: "Villa Lune de miel Coucher de soleil"
      alt: "Villa Lune de miel Coucher de soleil"
      specs: "95 m² · Vue sur le coucher de soleil · Bain extérieur"
      size: "95 m²"
      view: "Vue sur le coucher de soleil"
      description: "Une villa isolée, enveloppée de bougainvilliers, avec une cour privée, une baignoire en cuivre en plein air et une vue dégagée sur le légendaire coucher de soleil d’Oia."
      tagBath: "Bain extérieur"
      tagCourtyard: "Cour"
      tagSunset: "Vue sur le coucher de soleil"

    captains-quarters:
      # Marketing name. Nautical theme. The apostrophe is the hotel’s name for the room.
      name: "Quartiers du Capitaine"
      alt: "Quartiers du Capitaine"
      specs: "65 m² · Vue sur le port · Bassin de plongeon"
      size: "65 m²"
      view: "Vue sur le port"
      description: "Inspirée du patrimoine maritime de Santorini, cette suite offre des plafonds voûtés chaulés, des antiquités choisies à la main et une cour privée dotée d’un bassin de plongeon."
      tagPlunge: "Bassin de plongeon"
      tagVaulted: "Plafond voûté"
      tagCourtyard: "Cour"

    aegean-studio:
      # Marketing name. "Aegean" is the sea; keep it. "Cliff" and "Studio" may be translated.
      name: "Studio Falaise Aegean"
      alt: "Studio Falaise Aegean"
      specs: "45 m² · Vue sur la mer · Balcon privé"
      size: "45 m²"
      view: "Vue sur la mer"
      description: "Une retraite raffinée creusée dans la falaise volcanique, avec un balcon privé suspendu au-dessus de l’Aegean. Des lignes épurées se mêlent à la pierre naturelle dans ce studio conçu par un architecte."
      tagSea: "Vue sur la mer"
      tagBalcony: "Balcon"
      tagShower: "Douche à effet pluie"

# -----------------------------------------------------------------------------
# Date and guest popover. Guest voice. Opened from "Change dates and guests".
# -----------------------------------------------------------------------------
stay:
  # Plural of nights, lowercase, used inside sentences and the price breakdown.
  # {count} is a number. See the plural rules at the top of this file.
  night_one: "{count} nuit"
  night_other: "{count} nuits"
  # Same idea, title case, used in the hero summary ("3 Nights").
  nightTitle_one: "{count} nuit"
  nightTitle_other: "{count} nuits"
  # Title case, hero summary ("2 Guests").
  guestTitle_one: "{count} voyageur"
  guestTitle_other: "{count} voyageurs"
  # Guest count in the summary panel ("2 Adults").
  adult_one: "{count} adulte"
  adult_other: "{count} adultes"
  # Guest count when there are children. English "Child" / "Children" is irregular.
  child_one: "{count} enfant"
  child_other: "{count} enfants"
  # Extra people beyond the two guests included in the rate. Lowercase, mid-sentence.
  extraGuest_one: "{count} voyageur supplémentaire"
  extraGuest_other: "{count} voyageurs supplémentaires"
  # Bookings count on the back office list.
  booking_one: "{count} réservation effectuée sur le site de réservation"
  booking_other: "{count} réservations effectuées sur le site de réservation"
  # Nights column in the back office table.
  nightShort_one: "{count} nuit"
  nightShort_other: "{count} nuits"
  # Relative time in the back office. {count} is minutes or hours.
  minutesAgo_one: "il y a {count} min"
  minutesAgo_other: "il y a {count} min"
  hoursAgo_one: "il y a {count} h"
  hoursAgo_other: "il y a {count} h"
  # Less than a minute ago.
  justNow: "à l’instant"

  # Popover heading while the guest still needs to pick the departure date.
  selectCheckout: "Sélectionnez la date de départ"
  # Subtitle before a departure date is chosen.
  # {checkIn} is a short date such as "Fri, Jun 12, 2026". {max} is a number (30).
  checkoutHint: "Arrivée le {checkIn} · jusqu’à {max} nuits"
  # Screen-reader name for the previous-month arrow.
  previousMonth: "Mois précédent"
  # Screen-reader name for the next-month arrow.
  nextMonth: "Mois suivant"
  # Stepper label. Adults are ages 13+.
  adults: "Adultes"
  # Hint under "Adults".
  adultsHint: "À partir de 13 ans"
  # Stepper label.
  children: "Enfants"
  # Hint under "Children". An en dash between the ages.
  childrenHint: "De 2 à 12 ans"
  # Note under the steppers. {guests} is a number (2). {amount} is a money amount.
  extraGuestFee: "Les tarifs incluent {guests} voyageurs. Chaque voyageur supplémentaire est facturé {amount} par nuit."
  # Screen-reader name for the minus button. {who} is "adults" or "children", lowercase.
  removeGuests: "Réduire le nombre d’{who}"
  # Screen-reader name for the plus button. {who} is "adults" or "children", lowercase.
  addGuests: "Augmenter le nombre d’{who}"
  # Lowercase plural used only inside the screen-reader phrases above.
  adultsLower: "adultes"
  childrenLower: "enfants"

  # Column headers of the month grid, Sunday through Saturday, in that order.
  # The grid starts on Sunday. Do not reorder these seven keys.
  # Keep them very short (about 2 letters in English).
  weekdaySu: "Di"
  weekdayMo: "Lu"
  weekdayTu: "Ma"
  weekdayWe: "Me"
  weekdayTh: "Je"
  weekdayFr: "Ve"
  weekdaySa: "Sa"

# -----------------------------------------------------------------------------
# Page 2 — guest details form. Guest voice.
# -----------------------------------------------------------------------------
guest:
  # Form heading.
  title: "Informations du voyageur"
  # Line under the heading.
  subtitle: "Veuillez confirmer vos coordonnées pour la réservation"
  # Form labels. Each sits above an empty text field.
  firstName: "Prénom"
  lastName: "Nom"
  email: "Adresse courriel"
  phone: "Numéro de téléphone"
  address: "Adresse postale"
  city: "Ville"
  # Postal code. "ZIP" is the US term; "Postal" covers other countries. Keep both ideas.
  zip: "Code postal"
  country: "Pays"
  # First option in the country menu, shown before a country is chosen.
  countryPlaceholder: "Sélectionner…"
  # Returns to the room list. The arrow is part of the label; you may use your language’s back arrow.
  backToRooms: "← Retour aux chambres"
  # Submits the form and opens the payment step. Button.
  continueToPayment: "Continuer vers le paiement"
  # Heading of the side panel that repeats the chosen room.
  yourSelection: "Votre sélection"

  # Country menu. The stored value is the two-letter code; only the name is translated.
  # Use the country’s usual name in your language.
  countries:
    ES: "Espagne"
    GR: "Grèce"
    IT: "Italie"
    FR: "France"
    DE: "Allemagne"
    GB: "Royaume-Uni"
    US: "États-Unis"
    PT: "Portugal"
    NL: "Pays-Bas"
    CH: "Suisse"
    AT: "Autriche"
    BE: "Belgique"
    SE: "Suède"
    NO: "Norvège"
    DK: "Danemark"
    AU: "Australie"
    CA: "Canada"
    JP: "Japon"

# -----------------------------------------------------------------------------
# Page 3 — payment. Guest voice, plus a few presenter warnings.
# -----------------------------------------------------------------------------
booking:
  # Large photo on the payment page.
  heroAlt: "Vue sur la caldera de Santorini au coucher du soleil"
  # Three gallery captions under the payment-page photos.
  gallerySuiteAlt: "Intérieur de la Suite royale"
  gallerySuite: "La Suite royale"
  galleryPoolAlt: "Piscine à débordement"
  galleryPool: "Piscine à débordement"
  galleryDiningAlt: "Gastronomie raffinée"
  galleryDining: "Souper privé"
  # Property story heading.
  sanctuaryTitle: "Un sanctuaire au-dessus de la mer"
  # First paragraph of the property story. Place names stay.
  sanctuaryBody1: "Niché sur les falaises volcaniques d’Oia, The Caldera House est l’endroit où l’Aegean rencontre le ciel. Chaque suite s’ouvre sur des vues dégagées sur la caldera, avec des intérieurs en pierre sculptée à la main, des bassins de plongeon privés et des terrasses conçues pour contempler le coucher de soleil le plus célèbre du monde."
  # Second paragraph.
  sanctuaryBody2: "Depuis les soupers aux chandelles préparés par notre chef résident jusqu’au yoga à l’aube sur la falaise, chaque détail a été pensé pour que vous puissiez simplement profiter de l’instant."
  # Amenity list. Short phrases.
  amenityPool: "Piscine à débordement privée"
  amenityChef: "Service de chef en suite"
  amenityTerrace: "Terrasse avec vue sur la Caldera"
  amenitySpa: "Spa et bien-être"
  amenitySailing: "Excursion en voilier au coucher du soleil"
  amenityAirport: "Conciergerie aéroport"
  # Returns to the guest form. Arrow may be mirrored in RTL languages.
  backToGuest: "← Retour aux informations du voyageur"
  # Side panel heading on the payment step.
  yourStay: "Votre séjour"
  # Heading above the payment choice.
  payment: "Paiement"
  # Security reassurance under the pay button.
  secured: "Toutes les transactions sont sécurisées et chiffrées."
  # Line under that reassurance. {name} is the guest’s full name.
  guestLine: "Voyageur : {name}"
  # Tooltip on the pay button while Flywire demo credentials are missing.
  # Presenter voice — the person clicking has to open the back office first.
  credentialsFirst: "Ajoutez d’abord vos identifiants de démonstration Flywire dans le back-office de l’hôtel"
  # Notice when checkout rejects the configuration. {detail} is a technical field list from Flywire.
  # Presenter voice.
  configRejected: "Checkout a rejeté cette configuration : {detail}"
  # Notice when checkout fails to open. {detail} is the error text.
  couldNotStart: "Checkout n’a pas pu démarrer : {detail}"
  # Shown in the activity log when a card is saved and no money is taken.
  noAmount: "Aucun montant (carte enregistrée uniquement)"
  # Activity log value. Presenter voice. Checkout drawn on top of the page.
  displayOverlay: "Superposition plein écran"
  # Activity log value. Checkout placed inside the booking panel.
  displayEmbedded: "Intégré à la page"

  # Price breakdown lines. {nights} is "3 nights". {amount} is the nightly rate.
  nightlyCalc: "{nights} × {amount}"
  # {extras} is "1 extra guest" or "2 extra guests". {amount} is the fee. {nights} is "3 nights".
  extraCalc: "{extras} × {amount} × {nights}"

# -----------------------------------------------------------------------------
# Guest-facing names for the payment flow the presenter picked.
# These replace the "Payment" card title, description and the pay button.
# {amount} is a money amount such as "$7,350" or "€6.800".
# -----------------------------------------------------------------------------
flows:
  pay_full:
    # Guest sees this as the payment option title.
    guestTitle: "Paiement intégral"
    guestDesc: "Paiement unique de {amount}"
    # Pay button. {amount} is included.
    cta: "Payer {amount}"
    # Presenter sees this in the settings drawer, as the flow name.
    title: "Paiement intégral"
    # Presenter. One sentence under the flow name.
    pitch: "Tarifs prépayés, visites et expériences de dernière minute."
    # Link to a matching sample. Presenter.
    playground: "Paiement avec champs courants"

  reserve_hold:
    guestTitle: "Réserver avec préautorisation"
    guestDesc: "Préautorisation de {amount} dès aujourd’hui, débit à l’arrivée"
    cta: "Réserver avec préautorisation"
    title: "Réserver et préautoriser"
    # "Pre-authorize" means a card hold, not a charge. "API" is the Flywire programming interface; you may keep "API".
    pitch: "Préautorisez à la réservation, capturez à l’arrivée. Les préautorisations peuvent être prolongées ou augmentées via l’API."
    playground: "Paiement avec préautorisation"

  moto:
    # MOTO means Mail Order / Telephone Order: staff take the card, the guest is not on the website.
    # You may spell that out if the abbreviation is unknown, but keep it short (it is a menu title).
    guestTitle: "Paiement auprès du service des réservations"
    guestDesc: "Paiement de {amount} assisté par notre équipe"
    cta: "Encaisser le paiement de {amount}"
    title: "Réservations par téléphone et par courriel (MOTO)"
    pitch: "L’équipe des réservations encaisse le paiement des voyageurs qui réservent par téléphone ou par courriel."
    playground: "Paiement MOTO"

  save_card:
    guestTitle: "Garantie par carte"
    guestDesc: "Votre carte garantit la réservation. Aucun montant n’est débité aujourd’hui."
    cta: "Enregistrer la carte et réserver"
    title: "Enregistrer la carte, débiter plus tard"
    pitch: "Garantie par carte enregistrée. Débitez plus tard acomptes, soldes ou non-présentations avec le jeton."
    playground: "Tokenisation sans montant"

  pay_save:
    guestTitle: "Payer et enregistrer la carte"
    guestDesc: "Payez {amount} maintenant ; carte conservée pour vos prestations supplémentaires"
    cta: "Payer {amount} et enregistrer la carte"
    title: "Payer maintenant et enregistrer la carte"
    pitch: "Débitez maintenant et conservez la carte pour les prestations supplémentaires : matériel de plongée, spa, excursions, soldes."
    playground: "Tokenisation avec montant"

  hold_save:
    guestTitle: "Préautoriser et enregistrer la carte"
    guestDesc: "Préautorisation de {amount} ; carte conservée pour votre note finale"
    cta: "Réserver avec préautorisation"
    title: "Préautoriser et enregistrer la carte"
    pitch: "Préautorisez le séjour et conservez la carte pour la note finale et les frais accessoires."
    playground: "Tokenisation avec préautorisation"

  optional:
    guestTitle: "Paiement intégral"
    guestDesc: "Paiement unique de {amount}, avec la possibilité d’enregistrer votre carte"
    cta: "Payer {amount}"
    title: "Payer, le voyageur peut enregistrer sa carte"
    pitch: "Les voyageurs choisissent de conserver ou non leur carte pour leur prochain séjour. Idéal pour les clients fidèles."
    playground: "Tokenisation facultative"

  optional_hold:
    guestTitle: "Réserver avec préautorisation"
    guestDesc: "Préautorisation de {amount}, avec la possibilité d’enregistrer votre carte"
    cta: "Réserver avec préautorisation"
    title: "Préautoriser, le voyageur peut enregistrer sa carte"
    pitch: "Préautorisez le séjour ; le voyageur peut choisir de conserver sa carte enregistrée."
    playground: "Tokenisation facultative avec préautorisation"

  implicit:
    guestTitle: "Paiement intégral"
    guestDesc: "Paiement unique de {amount} ; carte conservée pour la durée de votre séjour"
    cta: "Payer {amount}"
    title: "Payer et conserver la carte enregistrée"
    pitch: "La carte est enregistrée automatiquement lorsque le moyen de paiement le permet. Idéal pour les soldes à régler et les paiements échelonnés."
    playground: "Tokenisation implicite"

  implicit_hold:
    guestTitle: "Réserver avec préautorisation"
    guestDesc: "Préautorisation de {amount} ; carte conservée pour la durée de votre séjour"
    cta: "Réserver avec préautorisation"
    title: "Préautoriser et conserver la carte enregistrée"
    pitch: "Préautorisez le séjour et enregistrez automatiquement la carte pour les débits ultérieurs."
    playground: "Tokenisation implicite avec préautorisation"

  # Extra sentence under the payment option when part of the money goes to partners.
  # {parts} is a list such as "sunset catamaran excursion ($350) and couples spa ritual ($250)".
  splitNote: "Comprend {parts} ; ces montants sont réglés directement auprès de nos partenaires."
  # Joiner used inside {parts} before the last partner. Same role as common.and, kept here
  # because it sits inside a guest sentence.
  splitAnd: "et"
  # Extra sentence when the hotel absorbs the card fee.
  noSurcharge: "Aucun supplément carte."

  # Presenter. Group headings in the flow list.
  groups:
    payment: "Paiements"
    tokenization: "Carte enregistrée"
    # Grey hint after the group name. Technical term for saving a card.
    tokenizationHint: "Tokenisation"
    optional: "Le voyageur choisit d’enregistrer sa carte"
    optionalHint: "Tokenisation facultative"
    implicit: "Carte enregistrée automatiquement"
    implicitHint: "Tokenisation implicite"
  # Presenter. Badge when a flow cannot be selected until an API key is saved.
  needsApiKey: "Clé API requise"
  # Presenter. Appended to the technical summary when the flow does not charge now.
  noAmountTech: "aucun montant"

  # Presenter. Extra sample links that appear when the matching setting is on.
  playground:
    authenticated: "Paiement avec session authentifiée"
    embedded: "Paiement intégré"
    split: "Paiement avec répartition"
    waive: "Paiement avec suppression du supplément carte"
    offerRules: "Paiement avec règles d’offres"
    styles: "Paiement avec styles personnalisés"
    timeout: "Paiement avec délai d’expiration"
    docs: "Guide de configuration de Checkout V2"

# -----------------------------------------------------------------------------
# Confirmation page after a successful checkout. Guest voice.
# -----------------------------------------------------------------------------
success:
  # Photo behind the confirmation.
  backgroundAlt: "Coucher de soleil sur Santorini"
  # Small line above the confirmation headline. Changes with the kind of payment.
  eyebrowPaid: "Réservation confirmée"
  eyebrowHold: "Réservation préautorisée"
  eyebrowCard: "Réservation garantie"
