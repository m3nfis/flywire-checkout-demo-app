  invalidSession: "ID de sessão inválido."
  invalidPayment: "ID de pagamento inválido."
  amountMinor: "amount tem de ser um número inteiro positivo em unidades menores (cêntimos)."
  chargeFields: "payment_method_token, mandate_id, payor_id, recipient_code e external_reference são obrigatórios."
  noApiKey: "Ainda não foi introduzida nenhuma chave de API."
  # {detail} is Flywire’s own rejection text, already ending with a period.
  keyRejected: "{detail} Aqui só funcionam chaves de demonstração da Flywire; as chaves de produção são rejeitadas."
  keyRejectedFallback: "A chave de API foi rejeitada."
  keyAccepted: "A API de demonstração aceitou esta chave."
  # {status} is an HTTP status number.
  apiAnswered: "A API de demonstração respondeu {status}."
  apiUnreachable: "Não foi possível contactar a API de demonstração da Flywire."
  needClientId: "Introduza um Client ID antes de consultar a moeda."
  needRecipient: "Introduza um código de destinatário antes de consultar a moeda."
  currencyFailed: "Não foi possível ler a moeda do destinatário."
  flywireUnreachable: "Não foi possível contactar a API da Flywire"
