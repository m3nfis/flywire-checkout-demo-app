# -----------------------------------------------------------------------------
# Hotel back office (/dashboard). Presenter / staff voice.
# -----------------------------------------------------------------------------
dashboard:
  # Header tag next to the hotel name.
  backOffice: "Backoffice"
  # [html] Keep <strong> around the words that should stay bold. "Flywire" is the company name.
  demoTag: "Flywire <strong>nur Demo-Umgebung</strong> · Daten in diesem Browser gespeichert"
  backToBooking: "← Buchungsseite"
  # Card heading. [html] "DEMO only" is a warning badge; keep the <span>.
  connectionTitle: "Flywire-Verbindung <span class=\"db-env-badge\">Nur DEMO</span>"
  # [html] The <code> wraps the API host, which is filled in by the app. Do not translate the host.
  connectionIntro: "Die Zugangsdaten Ihres Flywire-<strong>Demo</strong>-Kontos, verwendet von der Buchungsseite und von jeder Aktion auf dieser Seite. Anfragen gehen immer an die Flywire-Demo-API (<code>{host}</code>); Produktions-Zugangsdaten werden dort abgelehnt."
  # Screen-reader name for the book icon. {count} is added when clients exist.
  savedClients: "Gespeicherte Clients"
  savedClientsCount: "Gespeicherte Clients, {count} gespeichert"
  connectionNotChecked: "Nicht geprüft"
  # Form labels.
  clientName: "Kundenname"
  clientNamePlaceholder: "z. B. Mykonos Hotel"
  clientId: "Client-ID"
  clientIdPlaceholder: "UUID aus Ihrem Flywire-Demo-Konto"
  recipientCode: "Empfängercode"
  recipientCodePlaceholder: "z. B. ABC"
  savedCodesLabel: "Gespeicherte Codes für diese Client-ID"
  savedCodes: "Gespeicherte Codes"
  noSavedCodes: "Keine gespeicherten Codes"
  # Short label used when a pasted API key is cleaned. "API key" only; the header name stays in apiKeyLabel.
  apiKey: "API-Schlüssel"
  # [html] Do not translate X-Authentication-Key. It is the HTTP header name.
  apiKeyLabel: "API-Schlüssel <span class=\"db-hint\">X-Authentication-Key</span>"
  apiKeyPlaceholder: "Fügen Sie Ihren Demo-API-Schlüssel ein"
  # Submit button. Also referred to from credentials.officeBody — keep the two translations aligned.
  saveAndTest: "Speichern & Verbindung testen"
  clearCredentials: "Zugangsdaten löschen"
  recipientCurrency: "Empfängerwährung"
  # Fine print at the bottom of the credentials card.
  credentialsFootnote: "Nur Demo: Die Zugangsdaten werden in diesem Browser gespeichert, und der API-Schlüssel wird bei jeder Anfrage an den Server dieser Demo gesendet, der ihn an die Flywire-Demo-API weiterleitet. Bei einer echten Integration bleibt Ihr API-Schlüssel auf Ihrem Server."
  bookings: "Buchungen"
  clearAll: "Alle löschen"
  # Confirm dialog before deleting every booking in this browser.
  confirmClearBookings: "Alle Demo-Buchungen aus diesem Browser löschen?"
  # Confirm dialog before forgetting the credentials currently in use.
  confirmClearCredentials: "Diese Zugangsdaten nicht mehr verwenden? Gespeicherte Clients bleiben in diesem Browser erhalten und können erneut geladen werden."
  # {id} is the booking reference, such as a short id.
  confirmDeleteBooking: "Buchung {id} löschen?"

  saved:
    title: "Gespeicherte Clients"
    intro: "Ein API-Schlüssel pro Client-ID. Mit diesem Client gespeicherte Empfängercodes werden auf seiner Karte aufgeführt."
    close: "Gespeicherte Clients schließen"
    empty: "Noch keine gespeicherten Clients. Speichern und testen Sie eine Verbindung, um sie hier abzulegen."
    load: "Laden"
    noneYet: "Noch keine"
    unnamed: "Client ohne Namen"
    inUse: "In Verwendung"
    clientId: "Client-ID"
    apiKey: "API-Schlüssel"
    recipientCodes: "Empfängercodes"

  # Connection status pill. Keep these short.
  status:
    notSet: "Nicht festgelegt"
    checking: "Wird geprüft…"
    keyRejected: "Schlüssel abgelehnt"
    incomplete: "Unvollständig"
    checkFields: "Verbunden · Felder prüfen"
    connected: "Verbunden · Demo-API"
    unreachable: "Server nicht erreichbar"
  # {detail} is the reason from the server.
  keyRejectedDetail: "{detail} Prüfen Sie, ob ein Zeichen fehlt, oder fügen Sie den Schlüssel erneut ein."
  # {missing} is the list of fields still empty.
  keyWorksMissing: "Der API-Schlüssel funktioniert mit der Demo-API. Es fehlen noch: {missing}."
  # {name} is the optional client name plus a separator, or empty. {id} is the Client ID. {code} is " / ABC" or empty.
  savedInBrowser: " {name}{id}{code} in diesem Browser gespeichert."
  demoKeyAccepted: "Die Demo-API hat diesen Schlüssel akzeptiert."
  # Format warnings, shown before the API is called.
  clientIdFormat: "Die Client-ID sieht nicht wie eine UUID aus (8-4-4-4-12 Zeichen)."
  recipientFormat: "Empfängercodes bestehen aus 3 Buchstaben (ABC) oder 5 Zeichen, beginnend mit einem Buchstaben (ABC1D)."
  # {label} is Client ID, Recipient code or API key. {fixes} is a list of what was removed.
  cleanedPaste: "Eingefügten Inhalt bereinigt. {fixes}"
  cleanedField: "{label}: {fixes} entfernt."
  # What paste-cleanup removed. Used inside {fixes}. Lowercase, mid-sentence.
  fix:
    invisible: "unsichtbare Zeichen"
    nbsp: "geschützte Leerzeichen"
    quotes: "umgebende Anführungszeichen"
    fieldName: "der vorangestellte Feldname"
    bearer: "ein „Bearer“-Präfix"
    punctuation: "nachgestellte Satzzeichen"
    spacesInKey: "Zeilenumbrüche oder Leerzeichen im Schlüssel"
    spaces: "Leerzeichen"
    lowercase: "Kleinbuchstaben"

  # Empty bookings table.
  emptyTitle: "Noch keine Buchungen"
  emptyBody: "Nehmen Sie auf der Buchungsseite eine Buchung vor. Jeder gestartete Checkout erscheint hier."
  emptyAction: "Zur Buchungsseite"
  # Table headers.
  colBooking: "Buchung"
  colGuest: "Gast"
  colStay: "Aufenthalt"
  colAmount: "Betrag"
  colStatus: "Status"
  # Shown in the detail pane before a row is chosen.
  selectBooking: "Wählen Sie eine Buchung, um Zahlungen und Aktionen zu sehen."
  deleteBooking: "Buchung löschen"
  # Fact labels in the detail pane.
  factGuest: "Gast"
  factStay: "Aufenthalt"
  factCheckout: "Checkout"
  factTotal: "Buchungssumme"
  factAuthorized: "Autorisiert"
  factCaptured: "Eingezogen"
  factCharged: "Auf gespeicherte Karte belastet"
  factSession: "Sitzung"
  anonymousSession: "Anonym (nur Browser)"
  factSessionStatus: "Sitzungsstatus"
  factPaymentStatus: "Zahlungsstatus"
  factTokenization: "Tokenisierung"
  factLastChecked: "Zuletzt geprüft"
  payments: "Zahlungen"
  colPaymentId: "Zahlungs-ID"
  colMethod: "Zahlungsart"
  colCaptured: "Eingezogen"
  chargesTitle: "Belastungen der gespeicherten Karte"
  colWhatFor: "Wofür"
  colFlywirePayment: "Flywire-Zahlung"
  colResult: "Ergebnis"
  # “guest paid” is the label Flywire uses for the amount in the guest’s currency. You may keep the quotes.
  chargesNote: "Der Betrag ist das, was das Hotel belastet hat; „Gast zahlte“ ist das, was Flywire dem Gast in dessen eigener Währung belastet hat (charge_info)."
  # Secondary line under a charge amount. {amount} is money in the guest’s currency. Lowercase, mid-sentence.
  guestPaid: "Gast zahlte {amount}"
  savedCard: "Gespeicherte Karte"
  factCard: "Karte"
  factMethod: "Zahlungsart"
  # Card line. {brand} is Visa, Mastercard, etc. {last4} is four digits. {exp} is MM/YY.
  cardLine: "{brand} •••• {last4}"
  cardExpiry: "· gültig bis {exp}"

  # Booking status pills. Short.
  bookingStatus:
    failed: "Start fehlgeschlagen"
    abandoned: "Abgebrochen"
    timedOut: "Zeitüberschreitung"
    inCheckout: "Im Checkout"
    declined: "Abgelehnt"
    captured: "Eingezogen"
    partlyCaptured: "Teilweise eingezogen"
    authorized: "Autorisiert"
    processing: "In Bearbeitung"
    paid: "Bezahlt"
    cardSaved: "Karte gespeichert"
    completed: "Checkout abgeschlossen"

  # Hold explanation under the status, when money is authorized but not captured yet.
  holdPending: "Autorisiert: Der Betrag ist auf der Karte reserviert und wartet auf den Einzug."
  holdCaptureSent: "Einzug gesendet; Flywire verarbeitet ihn asynchron. Aktualisieren Sie den Status, um die Verbuchung zu sehen."

  # Same payment-status explanations as the activity drawer, shorter, for the back office.
  paymentStatusText:
    NO_PAYMENTS: "Es wurde keine Zahlung geleistet."
    SOME_IN_PROGRESS: "Eine Zahlung wird noch verarbeitet."
    ALL_UNSUCCESSFUL: "Alle Zahlungsversuche sind fehlgeschlagen."
    FULLY_PAID: "Der volle Betrag wurde bezahlt oder autorisiert."
    PARTIALLY_PAID: "Nur ein Teil des Betrags wurde bezahlt."
    OVERPAID: "Es wurde mehr als der angeforderte Betrag bezahlt."

  actionsTitle: "Aktionen"
  actionsSubtitle: "Flywire-API-Aufrufe über den Server dieser Demo"
  # Shown on an action button while its request is in flight.
  working: "Wird ausgeführt…"
  # {label} is the action name, e.g. "Capture payment".
  unavailableTitle: "{label} ist für diese Buchung nicht verfügbar. "
  # Link to the Flywire sample page. The arrow means "opens in a new tab".
  openPlayground: "Im Playground öffnen ↗"
  sendRequest: "{method}-Anfrage senden"
  sending: "Wird gesendet…"
  requestFormat: "Anfrageformat"
  # Tab label. "curl" is a command-line tool. [do not translate]
  curl: "curl"
  nodeFetch: "Node fetch"
  requestTitle: "Anfrage an Flywire"
  fillFields: "Füllen Sie die Felder oben aus."
  requestFootnote: "Der Server dieser Demo sendet sie mit Ihrem Demo-API-Schlüssel als X-Authentication-Key. Der Schlüssel wird hier nie angezeigt."
  # {when} is the booking’s creation date and time.
  created: "Erstellt {when}"
  activity: "Aktivität"
  request: "Anfrage"
  requestBody: "Anfragetext"
  response: "Antwort"
  showData: "Daten anzeigen"
  payment: "Zahlung"
  # {currency} is an ISO code.
  amountLabel: "Betrag ({currency})"
  amountPositive: "Geben Sie einen Betrag größer als null ein."
  amountMinimum: "Der Betrag muss mindestens {amount} betragen."
  whatForOffice: "Wofür (im Backoffice gespeichert)"
  # Do not translate external_reference. It is a field name.
  externalReference: "external_reference"
  needReference: "Fügen Sie für diese Belastung eine external_reference hinzu, z. B. die Buchungsnummer."
  tokenFromReport: "Aus dem tokenization_report der Sitzung. Bei Bedarf bearbeiten."
  tokenMissing: "Das Karten-Token war nicht im Sitzungsbericht enthalten. Aktualisieren Sie zuerst den Status oder fügen Sie die Token-Details aus dem Flywire-Portal ein."
  # Do not translate these three field names.
  paymentMethodToken: "payment_method_token"
  mandateId: "mandate_id"
  payorId: "payor_id"
  resumeNote: "Nachdem Flywire geantwortet hat, öffnet sich der Checkout auf dieser Seite mit der neuen run_id und dem neuen run_token."
  # {amount} is the current hold. Holds can be raised, never lowered.
  extendMinimum: "Mindestens {amount}: Vorautorisierungen können nur erhöht werden."
  currencyUnavailable: "Währung nicht verfügbar"
  # {code} is USD. {name} is "US Dollar". {symbol} is " ($)" or empty.
  currencyValue: "{code} · {name}{symbol}"
  currencyUsd: "Dieser Empfänger rechnet in USD ab, daher bleiben die Zimmerpreise in Dollar."
  # {rate} is a number. {code} is the currency. {date} is " · 2026-10-06" or empty.
  currencyRate: "1 USD = {rate} {code}{date}. Zimmerpreise und Checkout-Beträge verwenden diesen Kurs."
  # {who} is the recipient name and id. {detail} is the rest of the sentence.
  currencyLine: "{who}. {detail}"

  # Preset reasons when charging a saved card. Staff pick one from a menu.
  charges:
    minibar: "Minibar"
    spa: "Spa-Anwendung"
    lateCheckout: "Später Check-out"
    transfer: "Flughafentransfer"
    dive: "Miete von Tauchausrüstung"
    noShow: "No-Show-Gebühr"

  # The five staff actions. "help" is the paragraph. "reason" / "fix" show when the action cannot run.
  action:
    refresh: "Status aktualisieren"
    refreshHelp: "Liest die Sitzung von Flywire: Sitzungs-, Zahlungs- und Tokenisierungsberichte."
    resume: "Sitzung fortsetzen"
    resumeHelp: "Holt neue Durchlauf-Zugangsdaten für diese Sitzung und öffnet den Checkout damit dort wieder, wo der Gast aufgehört hat, z. B. um einen Zahlungslink zu senden."
    resumeOldReason: "Diese Buchung wurde vor der Unterstützung für das Fortsetzen erstellt."
    resumeOldFix: "Erstellen Sie eine neue Buchung."
    capture: "Zahlung einziehen"
    captureHelp: "Zieht die reservierten Beträge ganz oder teilweise ein (z. B. bei der Anreise). Jeder nicht eingezogene Betrag wird an den Gast freigegeben."
    extend: "Vorautorisierung verlängern"
    extendHelp: "Setzt die Vorautorisierung auf 7 Tage ab heute zurück und kann den autorisierten Betrag erhöhen (nur Erhöhung)."
    charge: "Gespeicherte Karte belasten"
    chargeHelp: "Belastet die beim Checkout gespeicherte Karte ohne Anwesenheit des Gastes, z. B. Minibar oder eine No-Show-Gebühr."
    noSessionReason: "Diese Buchung verwendete eine anonyme Sitzung, daher gibt es auf dem Server keine Sitzung zum Abfragen oder Fortsetzen."
    noSessionFix: "Verwenden Sie für neue Buchungen eine authentifizierte Sitzung (Einstellungen, Sitzung)."
    # {flow} is the flow name. {how} is either action.chargedImmediately or action.savedOnly.
    notHoldReason: "Flywire kann nur eine vorautorisierte Zahlung einziehen oder verlängern. Diese Buchung verwendete „{flow}“, {how}."
    chargedImmediately: "was den Gast sofort belastet hat"
    savedOnly: "was die Karte speichert, ohne etwas zu belasten oder zu reservieren"
    notHoldFix: "Um es zu demonstrieren, legen Sie eine Buchung mit einem Flow mit Vorautorisierung an: Reservieren & vorautorisieren, Vorautorisieren & Karte speichern, Vorautorisieren, Gast kann Karte speichern oder Vorautorisieren & Karte hinterlegen."
    noPaymentReason: "Zu dieser Buchung gibt es noch keine Zahlungs-ID."
    noPaymentFixRefresh: "Klicken Sie auf „Status aktualisieren“, nachdem der Gast den Checkout abgeschlossen hat."
    noPaymentFixGuest: "Der Gast hat den Checkout nicht abgeschlossen."
    # {amount} is money. {when} is a date and time.
    holdEndedReason: "{amount} wurde am {when} eingezogen, wodurch die Vorautorisierung endet: Alles, was nicht eingezogen wurde, wurde an den Gast freigegeben."
    holdEndedFixCard: "Verwenden Sie für Extras „Gespeicherte Karte belasten“: Bei dieser Buchung ist die Karte hinterlegt."
    holdEndedFixNew: "Um es erneut zu demonstrieren, legen Sie eine neue Buchung mit einem Flow mit Vorautorisierung an."
    noCardReason: "Bei dieser Buchung wurde keine Karte gespeichert."
    noCardFix: "Legen Sie eine Buchung mit einem Flow mit hinterlegter Karte an, z. B. „Karte speichern, später belasten“ oder „Jetzt bezahlen & Karte speichern“."
    fallbackFlow: "ein Flow"

  # History lines written after an action. {status} is a Flywire status code (do not translate the code).
  history:
    statusRefreshed: "Status aktualisiert"
    statusRefreshedWith: "Status aktualisiert · {status}"
    statusFailed: "Statusaktualisierung fehlgeschlagen"
    resumed: "Sitzung fortgesetzt · Checkout wieder geöffnet"
    resumeFailed: "Fortsetzen fehlgeschlagen"
    # {amount} is money. {status} is " · received" or empty.
    captured: "{amount} eingezogen{status}"
    holdRaised: "Vorautorisierung auf {amount} erhöht und um 7 Tage verlängert"
    holdExtended: "Vorautorisierung um 7 Tage verlängert"
    # {amount} {what} {reference} are filled by the form. {status} is empty or " · " plus a Flywire status code.
    charged: "{amount} belastet · {what} · {reference}{status}"
    # When an action fails, the history line is rewritten. {what} is the text before the first " · ". {error} is the API message.
    failedLine: "{what} fehlgeschlagen · {error}"
    failedSuffix: "fehlgeschlagen"
    checkoutAfterResume: "Checkout nach dem Fortsetzen abgeschlossen"
    checkoutAfterResumeStatus: "Checkout nach dem Fortsetzen abgeschlossen · {status}"
    guestClosedAgain: "Gast hat den Checkout erneut geschlossen"
    checkoutTimedOut: "Zeitüberschreitung beim Checkout"
    # {type} is an error code. Keep on_error.
    onError: "on_error('{type}')"
    couldNotStart: "Der Checkout konnte nicht gestartet werden: {detail}"

# -----------------------------------------------------------------------------
# Card brands and payment methods, shown next to a payment result.
# Brand names are trademarks. [do not translate] the brand names.
# "Card" / "Direct debit" / "Bank transfer" / "Online payment" are generic and should be translated.
# -----------------------------------------------------------------------------
cards:
  card: "Karte"
  directDebit: "Lastschrift"
  bankTransfer: "Banküberweisung"
  online: "Online-Zahlung"
  visa: "Visa"
  mastercard: "Mastercard"
  amex: "American Express"
  discover: "Discover"
  jcb: "JCB"
  diners: "Diners Club"
  unionpay: "UnionPay"
  maestro: "Maestro"

# -----------------------------------------------------------------------------
# Errors thrown in the browser before checkout opens. Shown in a notice or the activity log.
# -----------------------------------------------------------------------------
sdk:
  # Shown if the Flywire script never arrives. "connect.js" is a file name. [do not translate] the file name.
  sdkMissing: "Das Flywire Checkout V2 SDK wurde nicht geladen. Ist connect.js in die Seite eingebunden?"
  sessionCreateFailed: "Sitzungserstellung fehlgeschlagen"
  sessionLookupFailed: "Sitzungsabfrage fehlgeschlagen"
  # {message} is one of the two lines above. {status} is an HTTP status number.
  requestFailed: "{message} ({status})"
  # Recipient currency could not be read. Shown on the back office.
  currencyUnreadable: "Die Empfängerwährung konnte nicht gelesen werden."
  currencyUnreachable: "Dieser Demo-Server konnte nicht erreicht werden, um die Empfängerwährung zu lesen."

# -----------------------------------------------------------------------------
# Sentences the demo server returns and the back office displays.
# They are listed so translators can prepare them. The page language is saved
# in this browser, but the server still sends the English text. Do not translate
# URLs, header names, or field names inside these
# sentences when they are written as code.
# -----------------------------------------------------------------------------
server:
  # Returned with HTTP 401 when an action is attempted before an API key is saved.
  # "/dashboard" is the back-office path. You may keep the path in parentheses.
  missingCredentials: "Hinterlegen Sie zuerst Ihre Flywire-Demo-Zugangsdaten im Hotel-Backoffice (/dashboard)."
  invalidSession: "Ungültige Sitzungs-ID."
  invalidPayment: "Ungültige Zahlungs-ID."
  amountMinor: "amount muss eine positive Ganzzahl in kleinsten Währungseinheiten (Cent) sein."
  chargeFields: "payment_method_token, mandate_id, payor_id, recipient_code und external_reference sind erforderlich."
  noApiKey: "Noch kein API-Schlüssel eingegeben."
  # {detail} is Flywire’s own rejection text, already ending with a period.
  keyRejected: "{detail} Hier funktionieren nur Flywire-Demo-Schlüssel; Produktionsschlüssel werden abgelehnt."
  keyRejectedFallback: "Der API-Schlüssel wurde abgelehnt."
  keyAccepted: "Die Demo-API hat diesen Schlüssel akzeptiert."
  # {status} is an HTTP status number.
  apiAnswered: "Die Demo-API antwortete mit {status}."
  apiUnreachable: "Die Flywire-Demo-API konnte nicht erreicht werden."
  needClientId: "Geben Sie eine Client-ID ein, bevor die Währung abgefragt werden kann."
  needRecipient: "Geben Sie einen Empfängercode ein, bevor die Währung abgefragt werden kann."
  currencyFailed: "Die Empfängerwährung konnte nicht gelesen werden."
  flywireUnreachable: "Die Flywire-API konnte nicht erreicht werden"
