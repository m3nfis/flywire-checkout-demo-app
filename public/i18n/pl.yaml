# -----------------------------------------------------------------------------
# Errors thrown in the browser before checkout opens. Shown in a notice or the activity log.
# -----------------------------------------------------------------------------
sdk:
  # Shown if the Flywire script never arrives. "connect.js" is a file name. [do not translate] the file name.
  sdkMissing: "Nie wczytano SDK Flywire Checkout V2. Czy plik connect.js jest dołączony do strony?"
  sessionCreateFailed: "Nie udało się utworzyć sesji"
  sessionLookupFailed: "Nie udało się odczytać sesji"
  # {message} is one of the two lines above. {status} is an HTTP status number.
  requestFailed: "{message} ({status})"
  # Recipient currency could not be read. Shown on the back office.
  currencyUnreadable: "Nie udało się odczytać waluty odbiorcy."
  currencyUnreachable: "Nie udało się połączyć z serwerem tego demo, aby odczytać walutę odbiorcy."

# -----------------------------------------------------------------------------
# Sentences the demo server returns and the back office displays.
# They are listed so translators can prepare them. The page language is saved
# in this browser, but the server still sends the English text. Do not translate
# URLs, header names, or field names inside these
# sentences when they are written as code.
# -----------------------------------------------------------------------------
server:
  # Returned with HTTP 401 when an action is attempted before an API key is saved.
  # "/dashboard" is the back-office path. You may keep the path in parentheses.
  missingCredentials: "Najpierw proszę dodać dane dostępowe demo Flywire w panelu administracyjnym hotelu (/dashboard)."
  invalidSession: "Nieprawidłowy identyfikator sesji."
  invalidPayment: "Nieprawidłowy identyfikator płatności."
  amountMinor: "Pole amount musi być dodatnią liczbą całkowitą w jednostkach drobnych (centach)."
  chargeFields: "Wymagane pola: payment_method_token, mandate_id, payor_id, recipient_code i external_reference."
  noApiKey: "Nie wprowadzono jeszcze klucza API."
  # {detail} is Flywire’s own rejection text, already ending with a period.
  keyRejected: "{detail} Działają tu wyłącznie klucze demo Flywire; klucze produkcyjne są odrzucane."
  keyRejectedFallback: "Klucz API został odrzucony."
  keyAccepted: "API demo zaakceptowało ten klucz."
  # {status} is an HTTP status number.
  apiAnswered: "API demo zwróciło odpowiedź {status}."
  apiUnreachable: "Nie udało się połączyć z API demo Flywire."
  needClientId: "Proszę wprowadzić ID klienta, aby można było sprawdzić walutę."
  needRecipient: "Proszę wprowadzić kod odbiorcy, aby można było sprawdzić walutę."
  currencyFailed: "Nie udało się odczytać waluty odbiorcy."
  flywireUnreachable: "Nie udało się połączyć z API Flywire"
