    playground: "Opcjonalna tokenizacja"

  optional_hold:
    guestTitle: "Rezerwacja z blokadą środków"
    guestDesc: "Blokada {amount} na karcie z możliwością zapisania karty"
    cta: "Zarezerwuj z blokadą środków"
    title: "Blokada, gość może zapisać kartę"
