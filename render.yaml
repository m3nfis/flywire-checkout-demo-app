services:
  - type: web
    name: caldera-hotel-cpayex-v2-demo
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    # No Flywire credentials here: each user enters demo credentials in /dashboard.
    envVars:
      - key: NODE_ENV
        value: production
      - key: CPX_EVENT_URL
        sync: false
      - key: CPX_SPLIT_RECIPIENTS
        sync: false
      - key: CPX_PREVIEW_FEATURES
        sync: false
