services:
  - type: web
    name: caldera-hotel-cpayex-v2-demo
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CPX_CLIENT_ID
        sync: false
      - key: CPX_CODE
        sync: false
      - key: CPX_API_KEY
        sync: false
      - key: CPX_API_BASE
        sync: false
