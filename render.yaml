# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → connect this repo and apply, or paste this file when creating a Web Service.

services:
  - type: web
    name: caldera-hotel-elements-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: CPX_CLIENT_ID
        sync: false
      - key: CPX_CODE
        sync: false
      - key: CPX_API_KEY
        sync: false
      - key: CPX_API_BASE
        sync: false
